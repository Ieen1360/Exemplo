<body>
<canvas id="game" tabindex="0" aria-label="Old West, jogo 2D em pixel art"></canvas>
<script>
(function(){
'use strict';
/* =====================================================================
   OLD WEST  -  jogo 2D em pixel art
   ===================================================================== */
const W=480,H=272,T=16;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
ctx.imageSmoothingEnabled=false;
const FONT='"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';

/* ---------- utilidades ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=(x,y)=>{let h=Math.imul(x|0,374761393)^Math.imul((y|0)+977,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295;};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
const rc=(c,col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};

/* ---------- áudio ---------- */
let AC=null,NB=null,SFXG=null,MUSG=null,musicOn=true,sfxOn=true;
try{const cf=JSON.parse(localStorage.getItem('oldwest.cfg')||'null');if(cf){musicOn=cf.m!==false;sfxOn=cf.s!==false;}}catch(e){}
function saveCfg(){try{localStorage.setItem('oldwest.cfg',JSON.stringify({m:musicOn,s:sfxOn}));}catch(e){}}
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    SFXG=AC.createGain();SFXG.gain.value=1;SFXG.connect(AC.destination);
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(AC.destination);
    MUSG=AC.createGain();MUSG.gain.value=0.9;MUSG.connect(comp);
  }catch(e){AC=null;}
  if(AC)applyMusic();
}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||!sfxOn)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(SFXG);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,lp,delay){
  if(!AC||!sfxOn||!NB)return;
  try{
    const t=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=NB;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||2000;
    const g=AC.createGain();g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(SFXG);s.start(t,Math.random()*0.8);s.stop(t+dur+0.03);
  }catch(e){}
}
const SFX={
  rev(){noise(0.08,0.14,3500);tone(240,0.07,'square',0.05,-170);},
  sg(){noise(0.28,0.24,1400);tone(95,0.22,'sawtooth',0.09,-55);},
  dual(){noise(0.07,0.12,3800);tone(280,0.06,'square',0.045,-190);},
  efire(){noise(0.1,0.1,2500);tone(180,0.1,'square',0.04,-120);},
  jump(){tone(280,0.13,'square',0.04,260);},
  dj(){tone(420,0.14,'triangle',0.06,340);},
  land(){noise(0.06,0.05,900);},
  dash(){noise(0.14,0.07,5000);},
  hurt(){tone(220,0.35,'sawtooth',0.09,-170);noise(0.15,0.1,1200);},
  hit(){tone(520,0.05,'square',0.035,-260);},
  kill(){noise(0.22,0.12,1600);tone(170,0.22,'triangle',0.07,-110);},
  reload(){tone(900,0.04,'square',0.03);tone(650,0.05,'square',0.03,0,0.09);},
  reload2(){tone(500,0.05,'square',0.04);tone(760,0.06,'square',0.04,0,0.07);},
  boom(){noise(0.55,0.28,900);tone(70,0.45,'sawtooth',0.12,-40);},
  ui(){tone(660,0.06,'square',0.04);},
  ready(){tone(330,0.18,'square',0.06);tone(330,0.18,'square',0.06,0,0.25);},
  fogo(){tone(440,0.35,'sawtooth',0.08,200);noise(0.2,0.12,2500);},
  die(){tone(330,0.6,'triangle',0.08,-260);tone(220,0.8,'sine',0.05,-100,0.2);},
  save(){tone(523,0.12,'triangle',0.06);tone(659,0.12,'triangle',0.06,0,0.1);tone(784,0.2,'triangle',0.06,0,0.2);},
  pick(){tone(660,0.1,'square',0.05);tone(880,0.1,'square',0.05,0,0.1);tone(1320,0.2,'square',0.05,0,0.2);},
  wave(){noise(0.2,0.1,600);},
  card(){noise(0.06,0.07,6000);tone(900,0.04,'square',0.02,300);},
  tear(){noise(0.22,0.14,7000);tone(300,0.12,'sawtooth',0.04,-180);},
  pickup(){tone(880,0.07,'square',0.04);tone(1320,0.09,'square',0.04,0,0.07);},
  ignite(){noise(0.18,0.08,2500);tone(200,0.15,'sawtooth',0.03,200);},
  equip(){tone(500,0.05,'square',0.04);tone(750,0.07,'square',0.04,0,0.06);}
};
function sfx(n){const f=SFX[n];if(f)f();}

/* ---------- sprites ---------- */
/* O saco de pão do xerife: extraído pixel a pixel da imagem enviada */
const BAG=[
'....aaaaa.........',
'....abbca.........',
'....abbcaaaaa.....',
'....abccadeeda....',
'...aabcfadddeda...',
'..aaaaaaaaaaaaa...',
'.aaagghhhghhhhaaaa',
'adeaaaaaaaaaaaddaa',
'.adddddeeeeeeddaa.',
'..aaaaaaaaaaaaaa..',
'..aiiaiiiijkkiia..',
'..aiiaiiijjjjjka..',
'..aiijijjjjjjjka..',
'..aijaiaajjjaaja..',
'..aijaiaajjjaaja..',
'..aijiiaajjjaaja..',
'..aijaijjjjjjjkj..',
'..aiiaijjjjjjjka..',
'..aiiaiiiiiijkka..',
'..aia.aiaiaiaka...',
'...a...a.a.a.a....'];
/* Revólver redesenhado: martelo, tambor com estrias, cano com brilho, coronha de madeira e a mãozinha do saco */
const REV=[
'....kk...........',
'...kddk.kkkkkk...',
'...kmmkkklhlmkkkk',
'...kmmmkllhmmkhhk',
'...kdmmkmlmdkkddk',
'....kmmkmllmkkkkk',
'....kkkkkkkkkk.kk',
'...kttk.k..kk....',
'..kutttkvk.......',
'..kutttkvvk......',
'..kuttkvvvk......',
'...kkkkkkk.......'];
const PAL_P={a:'#000000',b:'#d3c8c8',c:'#fff2f2',d:'#613c09',e:'#7b4e0f',f:'#e4dada',g:'#8c250b',h:'#ff0000',i:'#cd9f5c',j:'#caa46e',k:'#c29554'};
const PAL_G={k:'#1b1816',d:'#3a3836',m:'#6e6c70',l:'#a9a5a1',h:'#e2ded8',v:'#4a2c12',t:'#cd9f5c',u:'#b08040'};

function fromRows(rows,pal){
  const h=rows.length,w=rows[0].length,[c,x]=mk(w,h);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=pal[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  return c;
}
function paintBody(c,rows,r0,r1,test,col){
  const x=c.getContext('2d');x.fillStyle=col;
  for(let j=r0;j<=r1&&j<rows.length;j++)for(let i=0;i<rows[j].length;i++)if(test(rows[j][i]))x.fillRect(i,j,1,1);
}
function scaleUp(c,k){const [n,x]=mk(c.width*k,c.height*k);x.drawImage(c,0,0,c.width*k,c.height*k);return n;}
function whiten(c){const [n,x]=mk(c.width,c.height);x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return n;}
function tint(c,col,a){const [n,x]=mk(c.width,c.height);x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return n;}
function flipH(c){const [n,x]=mk(c.width,c.height);x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return n;}
const isBody=ch=>ch==='i'||ch==='j'||ch==='k';

/* Bandana detalhada: dobras, bolinhas, nó e pontas soltas */
function paintBandana(c,P){
  const x=c.getContext('2d');
  const put=(px,py,k)=>{x.fillStyle=P[k];x.fillRect(px,py,1,1);};
  const rows={16:[3,'DHHHHRHHHHHD'],17:[3,'.DRRWRRRWRD.'],18:[3,'..DRRRRRRD..']};
  for(const y in rows){const r=rows[y];for(let i=0;i<r[1].length;i++){const k=r[1][i];if(k!=='.')put(r[0]+i,+y,k);}}
  [[2,16,'H'],[2,17,'R'],[1,16,'K'],[1,17,'D'],[1,18,'R'],[0,18,'K'],[0,19,'R'],[1,19,'D'],[0,20,'D'],[1,20,'R'],[2,18,'K']].forEach(p=>put(p[0],p[1],p[2]));
}
const S={};
S.player=fromRows(BAG,PAL_P);
S.playerW=whiten(S.player);

/* Capanga: saco queimado, chapéu preto, lenço vermelho */
S.bandit=fromRows(BAG,Object.assign({},PAL_P,{d:'#1b1b1f',e:'#34343a',g:'#2a2a2e',h:'#6b6b73',b:'#8a8a92',c:'#c9c9d0',f:'#a8a8b0',i:'#a4733a',j:'#b5844a',k:'#93642f'}));
paintBandana(S.bandit,{K:'#2a0a08',R:'#c0261b',D:'#8a1810',H:'#ea5040',W:'#f6ecdc'});
S.banditW=whiten(S.bandit);

/* Dinamiteiro: chapéu verde, cartucheira de dinamite */
S.dyn=fromRows(BAG,Object.assign({},PAL_P,{d:'#2f4a2a',e:'#43703a',g:'#8a6a00',h:'#ffd24a',b:'#9bbf8a',c:'#d6efc8',f:'#bcd8ac'}));
(function(){const x=S.dyn.getContext('2d');for(let k=0;k<7;k++){x.fillStyle='#b3171d';x.fillRect(4+k,11+k,2,1);x.fillStyle='#ffd24a';if(k%2===0)x.fillRect(5+k,11+k,1,1);}})();
S.dynW=whiten(S.dyn);

/* Urubu-saco: corpo de saco sem chapéu, bico laranja (as asas são desenhadas em tempo real) */
S.vult=(function(){
  const rows=BAG.slice(9),[c,x]=mk(18,rows.length);
  const pal={a:'#000',i:'#6f5f78',j:'#7d6b86',k:'#5f5068'};
  for(let j=0;j<rows.length;j++)for(let i=0;i<18;i++){const col=pal[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  x.fillStyle='#f2a22b';x.fillRect(15,3,3,2);x.fillStyle='#c97a14';x.fillRect(16,5,2,1);
  return c;
})();
S.vultW=whiten(S.vult);

/* Billy Reeves: saco grande (2x), chapéu preto com faixa dourada, lenço vermelho */
(function(){
  const base=fromRows(BAG,Object.assign({},PAL_P,{d:'#121214',e:'#26262b',g:'#7a5a00',h:'#ffcc00',b:'#8c1a1a',c:'#e04040',f:'#b32a2a',i:'#7d5c3c',j:'#8d6844',k:'#6c4e33'}));
  paintBandana(base,{K:'#1a0505',R:'#a8141a',D:'#6a0c10',H:'#d83a3a',W:'#e8d8c0'});
  S.boss=scaleUp(base,2);S.bossW=whiten(S.boss);
})();

/* Alma do xerife (estilo Cuphead): o saco todo azul-claro e translúcido */
S.ghost=fromRows(BAG,{a:'#5f86c4',b:'#ffffff',c:'#ffffff',d:'#bcd6ff',e:'#d4e6ff',f:'#ffffff',g:'#9bbcf0',h:'#b8d2ff',i:'#e2eeff',j:'#f2f8ff',k:'#d2e2f8'});

/* Armas */
const GUN={};
GUN.rev={img:fromRows(REV,PAL_G),px:6,py:4};
GUN.rev.len=GUN.rev.img.width;
(function(){
  const [c,x]=mk(22,7);
  rc(x,'#4a2c12',0,2,7,4);rc(x,'#7a4a1e',1,2,6,3);rc(x,'#9a6a34',1,2,5,1);rc(x,'#4a2c12',5,5,3,2);
  rc(x,'#3a3a40',7,1,4,4);rc(x,'#5a5a62',7,1,4,1);
  rc(x,'#26262b',11,1,11,4);rc(x,'#8a8a92',11,1,11,1);rc(x,'#0f0f13',11,3,11,1);
  rc(x,'#5b3a1a',12,5,6,2);rc(x,'#7a4a1e',12,5,6,1);
  GUN.sg={img:c,px:8,py:3,len:22};
})();

/* Coração do HUD (pré-renderizado) */
function mkHeart(fill,hi,out){
  const rows=['.##.##.','#######','#######','.#####.','..###..','...#...'],[c,x]=mk(16,14);
  x.fillStyle=out;
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(rows[j][i]==='#'){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(d=>x.fillRect(1+i*2+d[0],1+j*2+d[1],2,2));
  }
  x.fillStyle=fill;
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(rows[j][i]==='#')x.fillRect(1+i*2,1+j*2,2,2);
  if(hi){x.fillStyle=hi;x.fillRect(3,3,2,2);}
  return c;
}
const HEART_ON=mkHeart('#e8322a','#ff9a8a','#1a0805');
const HEART_OFF=mkHeart('#3a2a28',null,'#1a0805');


/* Cartas de vida: cada carta = 2 de vida. A carta rasga em duas etapas (canto, depois ao meio). */
const SUITB=[
 ['.##.##.','#######','#######','#######','.#####.','..###..','...#...'],
 ['...#...','..###..','.#####.','#######','#######','...#...','..###..'],
 ['...#...','..###..','.#####.','#######','.#####.','..###..','...#...']];
const SUITM=[['#.#','###','.#.'],['.#.','###','#.#'],['.#.','###','.#.']];
function mkCardSet(si){
  const CW=15,CH=21,[c,x]=mk(CW,CH),red=si!==1;
  const inside=(px,py)=>px>=0&&py>=0&&px<CW&&py<CH&&!((px===0||px===CW-1)&&(py===0||py===CH-1));
  for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
    if(!inside(i,j))continue;
    const edge=i===0||j===0||i===CW-1||j===CH-1;
    x.fillStyle=edge?'#1a0f08':((i===1||j===1||i===CW-2||j===CH-2)?'#d9c9a0':'#f6ecd2');x.fillRect(i,j,1,1);
  }
  const suitCol=red?'#c0261b':'#1a1a1e';
  x.fillStyle=suitCol;
  SUITB[si].forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]==='#')x.fillRect(4+i,7+j,1,1);});
  SUITM[si].forEach((r,j)=>{for(let i=0;i<3;i++)if(r[i]==='#'){x.fillRect(2+i,2+j,1,1);x.fillRect(10+i,16+j,1,1);}});
  x.fillStyle='#fff';x.fillRect(5,8,1,1);
  const jit=k=>Math.round(hash(k,si+7)*2-1);
  const inCorner=(px,py)=>py>=9+(14-px)*1.2+jit(px);
  const inA=(px,py)=>px<=3+py*0.35+jit(py+30);
  function part(src,test,fibers){
    const [n,nx]=mk(CW,CH),sd=src.getContext('2d').getImageData(0,0,CW,CH),od=nx.createImageData(CW,CH);
    for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
      const k=(j*CW+i)*4;
      if(sd.data[k+3]>0&&test(i,j)){od.data[k]=sd.data[k];od.data[k+1]=sd.data[k+1];od.data[k+2]=sd.data[k+2];od.data[k+3]=255;}
    }
    if(fibers){
      for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
        const k=(j*CW+i)*4;if(!od.data[k+3])continue;
        const nb=[[1,0],[-1,0],[0,1],[0,-1]].some(d=>{const a=i+d[0],b=j+d[1];if(a<0||b<0||a>=CW||b>=CH)return false;const kk=(b*CW+a)*4;return sd.data[kk+3]>0&&!od.data[kk+3];});
        if(nb){od.data[k]=hash(i,j)>0.5?255:217;od.data[k+1]=hash(i,j)>0.5?255:201;od.data[k+2]=hash(i,j)>0.5?255:160;}
      }
    }
    nx.putImageData(od,0,0);return n;
  }
  const full=c;
  const torn=part(c,(px,py)=>!inCorner(px,py),true);
  const corner=part(c,(px,py)=>inCorner(px,py),true);
  const halfA=part(torn,(px,py)=>inA(px,py),true);
  const halfB=part(torn,(px,py)=>!inA(px,py),true);
  const slot=(()=>{const [n,nx]=mk(CW,CH);for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){if(!inside(i,j))continue;const edge=i===0||j===0||i===CW-1||j===CH-1;if(edge){nx.fillStyle='rgba(0,0,0,0.55)';nx.fillRect(i,j,1,1);}else{nx.fillStyle='rgba(20,10,5,0.35)';nx.fillRect(i,j,1,1);}}return n;})();
  return {full,torn,corner,halfA,halfB,slot};
}
const CARDS=[mkCardSet(0),mkCardSet(1),mkCardSet(2)];
/* brilho suave (lampiões, bancos) */
const GLOW=(function(){const [c,x]=mk(64,64);const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,214,120,0.55)');g.addColorStop(0.45,'rgba(255,190,90,0.2)');g.addColorStop(1,'rgba(255,170,60,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c;})();
function glowAt(c,x,y,r,a){c.save();c.globalAlpha=a;c.globalCompositeOperation='lighter';c.drawImage(GLOW,Math.round(x-r),Math.round(y-r),r*2,r*2);c.restore();}
/* mato rolante (tumbleweed) */
function mkWeed(r){
  const n=r*2+6,[c,x]=mk(n,n),cols=['#8a5a2b','#5b3a1a','#a9733a'];
  x.translate(n/2,n/2);
  for(let i=0;i<9;i++){x.save();x.rotate(i*Math.PI/9);x.fillStyle=cols[i%3];x.fillRect(-r+(i%2),-1,(r-(i%2))*2,1);x.restore();}
  for(let i=0;i<18;i++){const a=i/18*Math.PI*2,rr=r*(0.8+0.15*hash(i,r));x.fillStyle=cols[i%3];x.fillRect(Math.round(Math.cos(a)*rr)-1,Math.round(Math.sin(a)*rr)-1,2,2);}
  return c;
}
const WEED_S=mkWeed(5),WEED_L=mkWeed(9);

/* ---------- entrada ---------- */
const keys={},pressed={};
const mouse={x:W/2,y:H/2,down:false,click:false,wheel:0};
const BLOCK=['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','ShiftLeft','ShiftRight'];
window.addEventListener('keydown',e=>{
  if(BLOCK.indexOf(e.code)>=0)e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true;
  keys[e.code]=true;initAudio();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(G&&G.state==='play')G.state='pause';});

/* =====================================================================
   TRILHA SONORA: jazz de big band dos anos 30, sintetizado em tempo real
   (baixo caminhante, piano stride, trompete, bateria com vassourinha)
   ===================================================================== */
const MF=n=>440*Math.pow(2,(n-69)/12);
const PCN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const QUAL={maj:[0,4,7,9],min:[0,3,7,10],dom:[0,4,7,10],m7:[0,3,7,10],dim:[0,3,6,9]};
const SCL={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10]};
const CELLS={
  normal:[[[0,2],[2,1],[3,1],[4,2],[6,2]],[[0,1],[1,1],[2,2],[4,1],[5,1],[6,2]],[[1,1],[2,1],[3,2],[5,1],[6,2]],[[0,3],[3,1],[4,4]],[[0,2],[2,2],[4,2],[6,1],[7,1]]],
  busy:[[[0,1],[1,1],[2,1],[3,1],[4,2],[6,1],[7,1]],[[0,2],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],[[1,1],[2,1],[3,1],[4,1],[5,1],[6,2]],[[0,1],[1,1],[2,2],[4,1],[5,1],[6,1],[7,1]]],
  sparse:[[[0,4],[4,2],[6,2]],[[2,2],[4,4]],[[0,3],[4,4]],[[1,3],[4,3],[7,1]]]
};
const TDEF={
  title:{bpm:100,sw:0.64,key:'C',mode:'maj',lead:'trumpet',drums:'swing',seed:7,lo:64,hi:82,dens:'normal',bars:'C Am F G7 C A7 Dm G7 F Fm C A7 D7 G7 C G7'},
  story:{bpm:72,sw:0.6,key:'A',mode:'min',lead:'clarinet',drums:'none',piano:'arp',bass:'half',seed:21,lo:60,hi:76,dens:'sparse',leadVol:0.06,bars:'Am F C G7 Am Dm E7 Am'},
  estrada:{bpm:126,sw:0.66,key:'C',mode:'maj',lead:'trumpet',drums:'swing',seed:3,lo:62,hi:81,dens:'normal',bars:'C A7 D7 G7 C A7 D7 G7 F Fm C A7 D7 G7 C G7'},
  rua:{bpm:138,sw:0.66,key:'F',mode:'maj',lead:'clarinet',drums:'swing',seed:5,lo:65,hi:84,dens:'busy',bars:'F D7 G7 C7 F D7 Gm C7 Bb Bbm F D7 Gm C7 F C7'},
  saloon:{bpm:104,sw:0.62,key:'D',mode:'min',lead:'clarinet',drums:'sparse',seed:9,lo:62,hi:78,dens:'sparse',bars:'Dm Dm Gm A7 Dm Bb A7 A7'},
  boss:{bpm:164,sw:0.6,key:'A',mode:'min',lead:'trumpet',drums:'driving',seed:13,lo:64,hi:84,dens:'busy',leadVol:0.085,bars:'Am Am Dm E7 Am F E7 E7 Dm Dm Am Am F Dm E7 E7'},
  deserto:{bpm:112,sw:0.64,key:'D',mode:'dor',lead:'clarinet',drums:'shuffle',seed:17,lo:62,hi:79,dens:'normal',bars:'Dm Dm Gm A7 Dm Bb A7 A7 Dm Gm Dm A7 Bb Gm A7 Dm'},
  cemiterio:{bpm:96,sw:0.62,key:'C',mode:'min',lead:'theremin',drums:'sparse',seed:19,lo:60,hi:77,dens:'sparse',bars:'Cm Cm Fm G7 Cm Ab G7 G7 Cm Fm Cdim G7 Cm Ab G7 Cm'},
  trem:{bpm:150,sw:0.62,key:'G',mode:'maj',lead:'trumpet',drums:'shuffle',seed:23,lo:62,hi:81,dens:'busy',bars:'G G C D7 G E7 A7 D7 G C G E7 A7 D7 G D7'},
  mina:{bpm:84,sw:0.62,key:'E',mode:'min',lead:'theremin',drums:'sparse',bass:'half',piano:'pad',seed:29,lo:58,hi:74,dens:'sparse',leadVol:0.06,bars:'Em Em Am B7 Em C B7 B7'},
  bar:{bpm:118,sw:0.66,key:'C',mode:'maj',lead:'clarinet',drums:'none',seed:37,lo:64,hi:79,dens:'sparse',leadVol:0.045,bars:'C A7 Dm G7 C A7 D7 G7 F Fm C A7 Dm G7 C G7'},
  rancho:{bpm:132,sw:0.65,key:'G',mode:'maj',lead:'clarinet',drums:'swing',seed:31,lo:62,hi:81,dens:'normal',bars:'G G C G D7 D7 G D7 G Em Am D7 G C D7 G'}
};
function parseChord(tok){
  const m=/^([A-G])([b#]?)(.*)$/.exec(tok);
  let pc=PCN[m[1]]+(m[2]==='#'?1:(m[2]==='b'?-1:0));pc=(pc+12)%12;
  const q=m[3],qual=q==='m'?'min':(q==='7'?'dom':(q==='m7'?'m7':(q==='dim'?'dim':'maj')));
  return {pc,qual,tones:QUAL[qual].map(x=>(pc+x)%12)};
}
function rng32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
/* melodia gerada: motivo de 4 compassos que se repete (A A B B), apoiado nos acordes */
function genMelody(tr,chords){
  const r=rng32(tr.seed),sc=SCL[tr.mode].map(x=>(x+PCN[tr.key])%12),cells=CELLS[tr.dens||'normal'];
  const pk=a=>a[Math.floor(r()*a.length)],events=[];
  let cur=Math.round((tr.lo+tr.hi)/2),dir=1;
  for(let b=0;b<chords.length;b++){
    const ch=chords[b],bi=b%8;
    if(tr.repeat!==false&&bi>=4&&bi<=6){events[b]=events[b-4].map(e=>({st:e.st,len:e.len,m:e.m}));continue;}
    const cell=pk(cells),pool=[];
    for(let m=tr.lo;m<=tr.hi;m++){const pc=m%12;if(sc.indexOf(pc)>=0||ch.tones.indexOf(pc)>=0)pool.push(m);}
    const evs=[];
    cell.forEach((c,ci)=>{
      const st=c[0],len=c[1],last=ci===cell.length-1;
      const strong=(st===0||st===4||(len>=2&&st%2===0));
      if(!strong&&r()<0.1)return;
      let m;
      if(strong||(last&&(b%4)===3)){
        const cand=pool.filter(n=>ch.tones.indexOf(n%12)>=0&&Math.abs(n-cur)<=7&&n!==cur);
        cand.sort((x,y)=>Math.abs(x-cur)-Math.abs(y-cur));
        m=cand.length?(r()<0.65?cand[0]:cand[Math.min(1,cand.length-1)]):cur;
      }else{
        let i=pool.indexOf(cur);
        if(i<0){i=0;let bd=99;pool.forEach((n,k)=>{const d=Math.abs(n-cur);if(d<bd){bd=d;i=k;}});}
        if(r()<0.25)dir=-dir;
        if(cur>tr.hi-3)dir=-1;if(cur<tr.lo+3)dir=1;
        i=clamp(i+dir*(r()<0.7?1:2),0,pool.length-1);m=pool[i];
      }
      cur=m;evs.push({st,len,m});
    });
    events[b]=evs;
  }
  const mel={};
  events.forEach((evs,b)=>evs.forEach(e=>{mel[b*8+e.st]={m:e.m,len:e.len};}));
  return mel;
}
const TCACHE={};
function getTrack(name){
  if(TCACHE[name])return TCACHE[name];
  const d=TDEF[name];if(!d)return null;
  const chords=d.bars.split(' ').map(parseChord);
  const tr=Object.assign({sw:0.64,piano:true,bass:'walk',leadVol:0.075,dens:'normal',repeat:true},d,{chords,nb:chords.length});
  tr.mel=genMelody(tr,chords);
  TCACHE[name]=tr;return tr;
}

/* ---------- instrumentos ---------- */
const Mus={name:null,want:null,bus:null,tr:null,i:0,next:0,timer:null,nodes:null,layer:1,tempoMul:1};
let duckV=1;
function nHit(t,dur,vol,freq,type,q){
  if(!AC||!NB||!Mus.bus)return;
  const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq;if(q)f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(Mus.bus);s.start(t,Math.random()*0.8);s.stop(t+dur+0.02);
}
function kickM(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+0.13);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g);g.connect(Mus.bus);o.start(t);o.stop(t+0.22);
}
function bassNote(t,m,dur,vol){
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();
  o.type='triangle';o2.type='sine';o.frequency.value=MF(m);o2.frequency.value=MF(m+12);g2.gain.value=0.25;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(vol*0.35,t+dur*0.55);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(Mus.bus);
  o.start(t);o2.start(t);o.stop(t+dur+0.03);o2.stop(t+dur+0.03);
}
function pianoNote(t,m,dur,vol){
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),fl=AC.createBiquadFilter();
  o.type='triangle';o2.type='square';o.frequency.value=MF(m);o2.frequency.value=MF(m);o2.detune.value=9;g2.gain.value=0.3;
  fl.type='lowpass';fl.frequency.value=3000;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(fl);fl.connect(Mus.bus);
  o.start(t);o2.start(t);o.stop(t+dur+0.03);o2.stop(t+dur+0.03);
}
function leadNote(dest,kind,t,m,dur,vol){
  const f=MF(m),o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain(),fl=AC.createBiquadFilter();
  if(kind==='theremin'){o.type='sine';o2.type='triangle';}
  else if(kind==='clarinet'){o.type='square';o2.type='sine';}
  else{o.type='sawtooth';o2.type='square';}
  o.frequency.value=f;o2.frequency.value=f;o2.detune.value=kind==='theremin'?0:6;g2.gain.value=0.45;
  fl.type='lowpass';fl.Q.value=1.2;
  const lo=kind==='trumpet'?900:(kind==='clarinet'?1000:1500),hi=kind==='trumpet'?2700:(kind==='clarinet'?1800:1700);
  fl.frequency.setValueAtTime(lo,t);fl.frequency.linearRampToValueAtTime(hi,t+0.06);
  const lfo=AC.createOscillator(),lg=AC.createGain();
  lfo.frequency.value=kind==='theremin'?5.2:5.8;
  lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(kind==='theremin'?32:14,t+Math.min(0.25,dur));
  lfo.connect(lg);lg.connect(o.detune);lg.connect(o2.detune);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.setValueAtTime(vol*0.85,t+Math.max(0.03,dur-0.08));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.04);
  o.connect(fl);o2.connect(g2);g2.connect(fl);fl.connect(g);g.connect(dest);
  const e=t+dur+0.08;o.start(t);o2.start(t);lfo.start(t);o.stop(e);o2.stop(e);lfo.stop(e);
}
function stabM(dest,t,notes,vol){
  notes.forEach(m=>{
    const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=MF(m);fl.type='lowpass';fl.frequency.setValueAtTime(2800,t);fl.frequency.exponentialRampToValueAtTime(900,t+0.16);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    o.connect(fl);fl.connect(g);g.connect(dest);o.start(t);o.stop(t+0.2);
  });
}

/* ---------- partitura: um passo = uma colcheia (swing) ---------- */
function drumStep(tr,st,t,L,b){
  const d=tr.drums;if(d==='none')return;
  const on=(st%2===0);
  if(d==='swing'){
    if(on)nHit(t,0.09,0.05,7000);
    if(st===3||st===7)nHit(t,0.07,0.032,7500);
    if(st===2||st===6)nHit(t,0.05,0.045,5200,'bandpass',2);
    if(st===0||st===4)kickM(t,0.07);
    if(st===7&&b%4===3)nHit(t,0.12,0.05,2400,'bandpass',1);
  }else if(d==='driving'){
    if(st===0||st===4||(st===3&&L>=2))kickM(t,0.11);
    if(st===2||st===6)nHit(t,0.14,0.11,2300,'bandpass',0.8);
    nHit(t,0.05,on?0.045:0.03,7500);
    if(L>=3&&st===7)nHit(t,0.1,0.07,1500,'bandpass',1);
  }else if(d==='shuffle'){
    if(on)nHit(t,0.1,0.06,2800,'bandpass',0.9);else nHit(t,0.06,0.035,3200,'bandpass',0.9);
    if(st===0||st===4)kickM(t,0.08);
    if(st===2||st===6)nHit(t,0.05,0.04,6500);
  }else if(d==='sparse'){
    if(st===2||st===6)nHit(t,0.06,0.035,5200,'bandpass',2);
    if(st===0&&b%2===0)kickM(t,0.05);
    if(st===4)nHit(t,0.09,0.03,7000);
  }
}
const bmid=pc=>{let m=36+pc;if(m>=48)m-=12;return m;};
function bassStep(tr,b,st,t,beat){
  const ch=tr.chords[b],nx=tr.chords[(b+1)%tr.nb];
  if(tr.bass==='half'){if(st===0)bassNote(t,bmid(ch.pc),beat*1.8,0.26);else if(st===4)bassNote(t,bmid(ch.tones[2]),beat*1.6,0.2);return;}
  if(st%2!==0)return;
  const k=st/2;let m;
  if(k===0)m=bmid(ch.pc);else if(k===1)m=bmid(ch.tones[(b%2)?2:1]);else if(k===2)m=bmid(ch.tones[2]);else m=bmid(nx.pc)+((b%2)?1:-1);
  bassNote(t,m,beat*0.82,k===0?0.3:0.22);
}
const voM=pc=>{let m=60+pc;if(m>69)m-=12;return m;};
function pianoStep(tr,b,st,t,beat){
  if(!tr.piano)return;
  const ch=tr.chords[b];
  if(tr.piano===true){
    const bm=pc=>{let m=48+pc;if(m>=60)m-=12;return m;};
    if(st===0)pianoNote(t,bm(ch.pc),beat*0.5,0.085);
    else if(st===4)pianoNote(t,bm(ch.tones[2]),beat*0.5,0.075);
    else if(st===2||st===6||(st===3&&(b*5+3)%4===0))[1,2,3].forEach(k=>pianoNote(t,voM(ch.tones[k]),beat*0.32,0.05));
  }else if(tr.piano==='pad'){
    if(st===0)[0,1,2].forEach(k=>pianoNote(t,voM(ch.tones[k])-12,beat*3.6,0.045));
  }else if(tr.piano==='arp'){
    pianoNote(t,voM(ch.tones[[0,1,2,1][st%4]])+(st>=4?12:0),beat*0.9,0.055);
  }
}
function scheduleStep(tr,s,t,beat){
  const b=Math.floor(s/8),st=s%8,L=Mus.layer;
  drumStep(tr,st,t,L,b);
  bassStep(tr,b,st,t,beat);
  pianoStep(tr,b,st,t,beat);
  if(L>=2&&tr.drums==='driving'&&(st===3||st===7)){const ch=tr.chords[b];stabM(Mus.bus,t,[1,2,3].map(k=>voM(ch.tones[k])),0.04);}
  const mm=tr.mel[s];
  if(mm){
    const off=j=>Math.floor(j/2)*beat+((j%2)?beat*tr.sw:0);
    const dur=Math.max(0.08,(off(st+mm.len)-off(st))*0.94);
    leadNote(Mus.bus,tr.lead,t,mm.m,dur,tr.leadVol);
    if(L>=3)leadNote(Mus.bus,tr.lead,t,mm.m+12,dur,tr.leadVol*0.4);
  }
  if(Math.random()<0.01)nHit(t+Math.random()*0.2,0.006,0.05,2000,'highpass');
}
function musicTick(){
  if(!AC||!Mus.bus||!Mus.tr)return;
  const tr=Mus.tr,ahead=AC.currentTime+0.9,steps=tr.nb*8;
  let guard=0;
  while(Mus.next<ahead&&guard++<64){
    const s=Mus.i%steps,beat=60/(tr.bpm*Mus.tempoMul);
    scheduleStep(tr,s,Mus.next,beat);
    Mus.next+=(s%2===0)?beat*tr.sw:beat*(1-tr.sw);
    Mus.i++;
  }
}
function stopTrack(fade){
  if(!Mus.bus||!AC)return;
  const b=Mus.bus,nodes=Mus.nodes,t=AC.currentTime,f=fade||0.3;
  try{b.gain.cancelScheduledValues(t);b.gain.setValueAtTime(Math.max(0.0001,b.gain.value),t);b.gain.linearRampToValueAtTime(0.0001,t+f);}catch(e){}
  setTimeout(()=>{try{nodes[0].stop();}catch(e){}try{b.disconnect();}catch(e){}},f*1000+1500);
  Mus.bus=null;Mus.name=null;
}
function startTrack(name){
  stopTrack(0.35);
  const tr=getTrack(name);if(!tr||!AC||!MUSG)return;
  const t=AC.currentTime,bus=AC.createGain();
  bus.gain.setValueAtTime(0.0001,t);bus.gain.linearRampToValueAtTime(1,t+0.25);
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=110;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5600;
  bus.connect(hp);hp.connect(lp);lp.connect(MUSG);
  const hs=AC.createBufferSource();hs.buffer=NB;hs.loop=true;
  const hf=AC.createBiquadFilter();hf.type='highpass';hf.frequency.value=3500;
  const hg=AC.createGain();hg.gain.value=0.012;
  hs.connect(hf);hf.connect(hg);hg.connect(bus);hs.start();
  Mus.name=name;Mus.bus=bus;Mus.tr=tr;Mus.i=0;Mus.next=t+0.12;Mus.nodes=[hs,hp,lp];
  if(!Mus.timer)Mus.timer=setInterval(musicTick,30);
}
function applyMusic(){
  if(!AC||!MUSG)return;
  if(!musicOn){stopTrack(0.2);return;}
  if(Mus.want&&Mus.want!==Mus.name)startTrack(Mus.want);
  else if(!Mus.want)stopTrack(0.5);
}
function setMusicOn(v){musicOn=v;saveCfg();applyMusic();}
function musicDuck(v){if(!AC||!MUSG||v===duckV)return;duckV=v;try{MUSG.gain.setTargetAtTime(0.9*v,AC.currentTime,0.12);}catch(e){}}
/* vinhetas curtas: vitória e morte */
function stinger(kind){
  if(!AC||!musicOn||!MUSG)return;
  const t0=AC.currentTime+0.05;
  if(kind==='victory'){
    [[72,0,0.16],[76,0.18,0.16],[79,0.36,0.16],[84,0.54,0.8]].forEach(n=>leadNote(MUSG,'trumpet',t0+n[1],n[0],n[2],0.11));
    stabM(MUSG,t0+0.54,[60,64,67,72],0.06);
  }else{
    [[58,0,0.4],[57,0.45,0.4],[56,0.9,0.4],[53,1.35,1.3]].forEach(n=>leadNote(MUSG,'trumpet',t0+n[1],n[0],n[2],0.1));
  }
}
function roomTrack(id){
  if(id==='saloon')return G.flags.bossDead?'estrada':'saloon';
  if(R&&R.sf!=null&&P&&P.y>(R.sf+4)*T)return 'mina';
  if(id==='montanha')return 'deserto';
  return TDEF[id]?id:'estrada';
}
/* decide qual faixa toca em cada momento do jogo */
function musicSync(){
  let want=null;const st=G.state;
  if(st==='title')want='title';
  else if(st==='story')want='story';
  else if(st==='shop')want='bar';
  else if(R&&P&&st!=='splash'){
    if(P.dead)want=null;
    else if(G.boss&&G.bossFight&&G.boss.st!=='dead')want='boss';
    else if(G.boss&&G.boss.st==='dead'&&!G.flags.bossDead)want=null;
    else if(G.dlg&&G.dlg.victory)want=null;
    else want=roomTrack(R.id);
  }
  if(want!==Mus.want){Mus.want=want;applyMusic();}
  if(want==='boss'&&G.boss){const ph=G.boss.ph||1;Mus.layer=ph;Mus.tempoMul=[1,1,1.05,1.1][ph];}else{Mus.layer=1;Mus.tempoMul=1;}
  musicDuck((st==='pause'||st==='map'||st==='inv'||st==='cards'||st==='camp')?0.4:1);
}

/* =====================================================================
   MUNDO: temas, cenário de fundo, tiles, decoração e salas

function disk(x,y,r,col){ctx.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));ctx.fillRect(Math.round(x-w),Math.round(y+dy),w*2,1);}}
function ridge(cx,par,base,amp,col,hi,seed){
  const bw=8,ox=cx*par,i0=Math.floor(ox/bw),n=Math.ceil(W/bw)+2;
  for(let k=0;k<n;k++){
    const i=i0+k,b=Math.floor(i/7),m=((i%7)+7)%7;
    let h=Math.floor((0.35+hash(b,seed)*0.65)*amp/6)*6;
    if(hash(b,seed+9)>0.55&&m>=2&&m<=4)h+=Math.floor(hash(b,seed+3)*amp*0.5/6)*6;
    if(hash(b,seed+5)<0.2)h=Math.floor(h*0.35/6)*6;
    const x=Math.round(i*bw-ox);
    ctx.fillStyle=col;ctx.fillRect(x,base-h,bw,H-(base-h)+40);
    ctx.fillStyle=hi;ctx.fillRect(x,base-h,bw,2);
  }
}
function dunes(cx,par,base,amp,col,hi){
  const ox=cx*par;
  for(let sx=0;sx<W;sx+=4){
    const wx=sx+ox,h=Math.floor((amp*(0.55+0.45*Math.sin(wx*0.017))+amp*0.35*Math.sin(wx*0.049+2))/2)*2;
    ctx.fillStyle=col;ctx.fillRect(sx,base-h,4,H-(base-h)+40);
    ctx.fillStyle=hi;ctx.fillRect(sx,base-h,4,2);
  }
}
/* Desenha o fundo com paralaxe. th = tema, cx/cy = câmera, t = tempo */
function drawBG(th,cx,cy,t){
  const n=th.sky.length,bh=Math.ceil(H/n),oy=-cy*0.25;
  for(let i=0;i<n;i++){ctx.fillStyle=th.sky[i];ctx.fillRect(0,i*bh,W,bh);}
  if(th.mineBG){
    for(let k=-1;k<6;k++){
      const x=Math.round(k*110-((cx*0.45)%110));
      rc(ctx,'#2b1a10',x,0,10,H);rc(ctx,'#1a0f09',x+8,0,2,H);
      rc(ctx,'#2b1a10',x-60,Math.round(70+oy%90),120,6);
    }
    for(let i=0;i<26;i++){const x=Math.floor(hash(i,2)*W),y=Math.floor(hash(i,3)*H);rc(ctx,'#2e2018',x,y,3,2);}
    ridge(cx,0.3,H*0.9,60,th.mid[0],th.mid[1],11);
    return;
  }
  if(th.stars){
    for(let i=0;i<60;i++){
      const x=Math.floor(((hash(i,7)*W*1.3-cx*0.03)%W+W)%W),y=Math.floor(hash(i,8)*H*0.55)+oy*0.2;
      ctx.fillStyle=(Math.sin(t*0.05+i)>0.7)?'#fff':'#9aa6e0';ctx.fillRect(x,y,2,2);
    }
  }
  if(th.sun){
    if(th.stars){disk(th.sx,th.sy+oy*0.4,th.sr,th.sun);disk(th.sx+5,th.sy-3+oy*0.4,th.sr-3,'#c8d0f0');}
    else {disk(th.sx,th.sy+oy*0.4,th.sr+6,th.sky[4]);disk(th.sx,th.sy+oy*0.4,th.sr,th.sun);}
  }
  if(th.clouds){
    for(let i=0;i<5;i++){
      const x=(((hash(i,3)*700+t*0.08*(0.6+hash(i,4))-cx*0.05)%(W+120))+(W+120))%(W+120)-60,y=18+hash(i,5)*70+oy*0.3;
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(x,y,44,8);ctx.fillRect(x+8,y-6,26,8);ctx.fillRect(x+4,y+8,34,4);
    }
  }
  const sh=oy;
  ctx.save();ctx.translate(0,sh);
  ridge(cx,0.12,Math.round(H*0.6),76,th.far[0],th.far[1],3);
  ridge(cx,0.25,Math.round(H*0.72),58,th.mid[0],th.mid[1],7);
  dunes(cx,0.45,Math.round(H*0.82),24,th.dune[0],th.dune[1]);
  ctx.restore();
}

function isSolV(r,x,y){if(y<0)return false;if(y>=r.h)return true;if(x<0||x>=r.w)return true;const c=r.g[y][x];return isSolCh(c)||c==='F';}
function postsUnder(x,r){
  /* vigas de madeira apoiando cada tábua até o chão (nada fica flutuando) */
  for(let ty=0;ty<r.h;ty++){
    let tx=0;
    while(tx<r.w){
      if(r.g[ty][tx]!=='='){tx++;continue;}
      let e=tx;while(e<r.w&&r.g[ty][e]==='=')e++;
      const cols=e-tx>=4?[tx,e-1]:[tx];
      for(const cx of cols){
        let yb=ty+1;while(yb<r.h&&!isSolV(r,cx,yb)&&r.g[yb][cx]!=='=')yb++;
        if(yb-ty>15||yb>=r.h)continue;
        const px=cx===tx?cx*T+3:cx*T+10,top=ty*T+6,bot=yb*T;
        rc(x,'#3b2514',px-1,top,5,bot-top);rc(x,'#6b4220',px,top,3,bot-top);rc(x,'#8a5a2b',px,top,1,bot-top);
        for(let yy=top+10;yy<bot-4;yy+=22){rc(x,'#3b2514',px-2,yy,7,2);}
      }
      if(e-tx>=4){
        const yb2=Math.min(ty+3,r.h-1);
        if(!isSolV(r,tx+1,ty+1)&&!isSolV(r,e-2,ty+1)){
          for(let k=0;k<(e-tx-1)*T-8;k+=2){const yy=ty*T+8+Math.round(k*0.18);if(yy>yb2*T)break;rc(x,'#4a2c12',tx*T+5+k,yy,2,1);}
        }
      }
      tx=e;
    }
  }
}
function renderTiles(r){
  const th=THEMES[r.theme],[c,x]=mk(r.w*T,r.h*T);r.tc=c;
  postsUnder(x,r);
  for(let ty=0;ty<r.h;ty++)for(let tx=0;tx<r.w;tx++){
    const ch=r.g[ty][tx];if(ch==='.')continue;
    const X=tx*T,Y=ty*T;
    if(ch==='#'){const top=!isSolV(r,tx,ty-1);let d=0;while(d<3&&isSolV(r,tx,ty-1-d))d++;sand(x,th.sand,X,Y,tx,ty,top,d);}
    else if(ch==='R'||ch==='F')rock(x,th.rock,X,Y,tx,ty,!isSolV(r,tx,ty-1));
    else if(ch==='W')wood(x,X,Y,tx,ty);
    else if(ch==='X')barricade(x,X,Y,tx,ty);
    else if(ch==='=')plank(x,X,Y,r.g[ty][tx-1]==='=',r.g[ty][tx+1]==='=');
  }
}

(function(){let x=0;CHAIN.forEach(id=>{MPOS[id]={x,y:0};x+=RDIM[id][0]+12;});MPOS.mina={x:MPOS.deserto.x+55,y:44};MPOS.montanha={x:MPOS.deserto.x+128,y:-72};})();

function room(id,w,h,theme,sf){return {id,name:NAMES[id],w,h,theme,sf:sf==null?null:sf,g:Array.from({length:h},()=>Array(w).fill('.')),exits:{},defs:[],decor:null,caves:[],holes:[],fakes:[],props:[]};}
const FL=r=>r.sf!=null?r.sf:r.h-3;
function fl(r,a,b){for(let x=a;x<b;x++)for(let y=FL(r);y<Math.min(r.h,FL(r)+3);y++)r.g[y][x]='#';}
function deep(r){for(let y=FL(r)+3;y<r.h;y++)for(let x=0;x<r.w;x++)r.g[y][x]='R';}
function blk(r,x,y,w,h,ch){for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(y+j>=0&&y+j<r.h&&x+i>=0&&x+i<r.w)r.g[y+j][x+i]=ch;}}
function plat(r,x,y,n){for(let i=0;i<n;i++)if(x+i>=0&&x+i<r.w&&r.g[y][x+i]==='.')r.g[y][x+i]='=';}
function en(r,t,tx,ty,o){r.defs.push(Object.assign({k:'en',t,x:tx*T+8,y:(ty==null?FL(r):ty)*T},o||{}));}
function st(r,t,tx,o){const d=Object.assign({k:'st',t,x:tx*T+8,y:FL(r)*T},o||{});if(o&&o.row!=null)d.y=o.row*T;r.defs.push(d);}
function fake(r,x,y,w,h,id){r.fakes.push({x,y,w,h,id});if(!G.flags.secrets||!G.flags.secrets[id])blk(r,x,y,w,h,'F');else blk(r,x,y,w,h,'.');}
function rr(seed){const f=rng32(seed);return {f,i:(a,b)=>a+Math.floor(f()*(b-a+1)),p:a=>a[Math.floor(f()*a.length)],c:p=>f()<p};}
const nearHole=(r,a,b)=>r.holes.some(h=>h[0]<=b+2&&h[1]>=a-2);
function standRow(r,x,y0){let y=y0;while(y>1&&isSolCh(r.g[y-1][x]))y--;return y;}
function foe(r,x,row,pool,R){
  const t=R.p(pool),base=row==null?FL(r):row;
  if(t==='vult')en(r,'vult',x,base-R.i(5,8),{rng:R.i(40,70)});
  else if(t==='weed'){if(row==null)en(r,'weed',x);}
  else en(r,t,x,row,{rng:R.i(16,40)});
}
/* superfície: sequência de trechos com subidas de até 3 blocos */
function surf(r,x0,x1,seed,pool,dens){
  const R=rr(seed),s=FL(r);let x=x0;
  while(x<x1-8){
    let k=R.p(['flat','flat','steps','plats','mesa','crates','cacti','high','plats']);
    const span={flat:9,steps:16,plats:15,mesa:16,crates:9,cacti:11,high:12}[k];
    if(x+span>x1||nearHole(r,x,x+span)){
      const w=4;if(R.c(dens*0.5)&&!nearHole(r,x,x+w))foe(r,x+1,null,pool.filter(t=>t!=='weed'),R);x+=w;continue;
    }
    if(k==='flat'){const w=R.i(5,9);if(R.c(dens))foe(r,x+R.i(1,w-2),null,pool,R);if(R.c(0.25))r.props.push(['cactusbg',x+R.i(1,w-1)]);x+=w;}
    else if(k==='steps'){const w=R.i(9,13);blk(r,x,s-2,3,2,'R');blk(r,x+3,s-3,w-6,3,'R');blk(r,x+w-3,s-2,3,2,'R');if(R.c(dens))foe(r,x+(w>>1),s-3,pool.filter(t=>t!=='weed'),R);x+=w+R.i(2,3);}
    else if(k==='mesa'){const w=R.i(6,9);blk(r,x,s-2,2,2,'R');blk(r,x+2,s-5,w,5,'R');blk(r,x+2+w,s-2,2,2,'R');if(R.c(dens))foe(r,x+2+(w>>1),s-5,['bandit','dyn','miner'].filter(t=>pool.indexOf(t)>=0||t==='bandit'),R);x+=w+R.i(5,6);}
    else if(k==='plats'){plat(r,x,s-3,4);plat(r,x+5,s-5,4);plat(r,x+10,s-3,4);if(R.c(dens))en(r,'bandit',x+6,s-5,{rng:14});if(R.c(0.4))en(r,'vult',x+7,s-9,{rng:50});x+=15;}
    else if(k==='crates'){blk(r,x+1,s-2,2,2,'W');blk(r,x+3,s-4,2,4,'W');if(R.c(dens*0.6))en(r,'bandit',x+4,s-4,{rng:2});x+=R.i(7,9);}
    else if(k==='cacti'){st(r,'cactus',x+2);st(r,'cactus',x+R.i(5,7));x+=R.i(9,11);}
    else if(k==='high'){plat(r,x,s-3,4);plat(r,x+3,s-6,4);plat(r,x+7,s-9,4);st(r,'bag',x+8,{row:s-9,id:r.id+'_b'+x,coins:R.i(4,7)});x+=12;}
  }
}
/* túnel subterrâneo: caverna escavada na rocha, com dois poços de acesso */
function cave(r,x0,x1,seed,pool){
  const R=rr(seed),fy=r.h-3,s=FL(r);
  for(let x=x0;x<x1;x++){const top=s+5+Math.floor(hash(x>>2,seed)*3);for(let y=top;y<fy;y++)r.g[y][x]='.';}
  for(let x=x0+9;x<x1-10;x+=R.i(10,15)){const h=R.i(1,2);blk(r,x,fy-h,R.i(2,4),h,'R');}
  shaft(r,x0+1);shaft(r,x1-5);
  for(let x=x0+7;x<x1-10;x+=R.i(9,13)){plat(r,x,fy-4,4);if(R.c(0.5))plat(r,x+2,fy-7,3);}
  for(let x=x0+9;x<x1-9;x+=R.i(7,10)){
    const t=R.p(pool);
    if(t==='vult')en(r,'vult',x,fy-7,{rng:40});
    else{const row=standRow(r,x,fy);en(r,t,x,row,{rng:R.i(14,28)});}
  }
  const mx=(x0+x1)>>1;st(r,'chest',mx,{row:standRow(r,mx,fy),id:r.id+'_c'+x0,coins:R.i(8,14)});
  r.caves.push([x0,x1]);
}
function shaft(r,x){
  const s=FL(r);
  for(let y=s;y<=s+7;y++)for(let i=0;i<4;i++)r.g[y][x+i]='.';
  [r.h-7,r.h-10,r.h-13,r.h-16,r.h-19].forEach((y,k)=>{if(y>s)plat(r,x+(k%2),y,3);});
  r.holes.push([x,x+3]);
}

const POOL_CAVE=['miner','miner','vult','bandit','miner'];

/* decoração espalhada pelas fases longas */
function scatterDecor(c,r,seed,kinds){
  const g=FL(r)*T,R=rr(seed);
  for(let x=4;x<r.w-4;x+=R.i(5,11)){
    if(nearHole(r,x,x+1))continue;
    const k=R.p(kinds),px=x*T+8;
    if(k==='fence')dFence(c,x*T,g,R.i(2,5));
    else if(k==='tree')dTree(c,px,g,R.i(30,50));
    else if(k==='cactus')dCactus(c,px,g,R.i(20,34));
    else if(k==='boulder')dBoulder(c,x*T,g,R.i(16,26),R.i(10,16),r.theme==='night'?'#50507e':'#a07f68');
    else if(k==='bones')dBones(c,px,g);
    else if(k==='barrel')dBarrel(c,px,g);
    else if(k==='tomb')dTomb(c,px,g,R.i(0,2));
    else if(k==='lamp')dLamp(c,px,g,r.theme==='night'?'#8fb8ff':'#ffd86b',R.i(28,40));
  }
  r.props.forEach(p=>{if(p[0]==='cactusbg')dCactus(c,p[1]*T+8,g,22);});
}
function caveDecor(c,r){
  const s=FL(r);
  if(r.sf==null)return;
  rc(c,'#1a110c',0,(s+1)*T,r.w*T,(r.h-s-1)*T);
  r.caves.forEach(cv=>{
    const x0=cv[0]*T,x1=cv[1]*T,y0=(s+3)*T,y1=r.h*T;
    rc(c,'#2a1c14',x0,y0,x1-x0,y1-y0);
    for(let x=x0+40;x<x1-20;x+=96){rc(c,'#3b2514',x,y0,8,y1-y0);rc(c,'#241509',x,y0,2,y1-y0);rc(c,'#3b2514',x-30,y0+70,68,6);}
    for(let x=x0+24;x<x1-10;x+=120)dLamp(c,x,(r.h-3)*T-40,'#ffb347',18);
    for(let i=0;i<14;i++){const xx=x0+Math.floor(hash(i,cv[0])*(x1-x0)),yy=y0+Math.floor(hash(i,cv[1])*(y1-y0));rc(c,'#4aa8c8',xx,yy,2,2);}
    for(let x=x0;x<x1;x+=18)rc(c,'#463428',x,(r.h-3)*T-2,12,2);
  });
}

/* ---------- física de tiles ---------- */
function solidTile(tx,ty,pl){
  if(ty<0||ty>=R.h)return true;
  if(tx<0)return pl?!R.exits.left:true;
  if(tx>=R.w)return pl?!R.exits.right:true;
  return isSolCh(R.g[ty][tx]);
}
function oneWay(tx,ty){return tx>=0&&tx<R.w&&ty>=0&&ty<R.h&&R.g[ty][tx]==='=';}
function groundAt(x,y){const tx=Math.floor(x/T),ty=Math.floor((y+2)/T);return solidTile(tx,ty,false)||oneWay(tx,ty);}
function clearLine(x0,y0,x1,y1){
  const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/8);
  for(let i=1;i<n;i++){const t=i/n;if(solidTile(Math.floor((x0+(x1-x0)*t)/T),Math.floor((y0+(y1-y0)*t)/T),false))return false;}
  return true;
}
/* corpo: x = centro, y = pés, w/h = caixa */
function bodyMove(b,pl){
  b.x+=b.vx;b.hitWall=false;
  let l=b.x-b.w/2,r=b.x+b.w/2;
  const y0=Math.floor((b.y-b.h)/T),y1=Math.floor((b.y-0.01)/T);
  if(b.vx>0){const tx=Math.floor((r-0.001)/T);for(let ty=y0;ty<=y1;ty++)if(solidTile(tx,ty,pl)){b.x=tx*T-b.w/2-0.001;b.vx=0;b.hitWall=true;break;}}
  else if(b.vx<0){const tx=Math.floor(l/T);for(let ty=y0;ty<=y1;ty++)if(solidTile(tx,ty,pl)){b.x=(tx+1)*T+b.w/2+0.001;b.vx=0;b.hitWall=true;break;}}
  const pb=b.y;b.y+=b.vy;b.onGround=false;
  l=b.x-b.w/2;r=b.x+b.w/2;
  const x0=Math.floor(l/T),x1=Math.floor((r-0.001)/T);
  if(b.vy>=0){
    const ty=Math.floor(b.y/T);
    for(let tx=x0;tx<=x1;tx++){
      if(solidTile(tx,ty,pl)||(!(b.drop>0)&&oneWay(tx,ty)&&pb<=ty*T+0.01)){b.y=ty*T;b.vy=0;b.onGround=true;break;}
    }
  }else{
    const ty=Math.floor((b.y-b.h)/T);
    for(let tx=x0;tx<=x1;tx++)if(solidTile(tx,ty,pl)){b.y=(ty+1)*T+b.h;b.vy=0;break;}
  }
}
const ov=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs((a.y-a.h/2)-(b.y-b.h/2))<(a.h+b.h)/2;
const inBox=(px,py,e,r)=>Math.abs(px-e.x)<e.w/2+r&&Math.abs(py-(e.y-e.h/2))<e.h/2+r;

function burst(x,y,n,cols,spd,grav,life,sz){
  for(let i=0;i<n;i++){
    const a=rnd(Math.PI*2),s=rnd(0.3,spd||2);
    PART.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.8,life:(life||30)*rnd(0.6,1),max:life||30,col:pick(cols),sz:sz||2,grav:grav===undefined?0.1:grav});
  }
}
const crumbs=(x,y,n)=>burst(x,y,n,['#cd9f5c','#caa46e','#c29554','#e6c48a','#000000'],2.6,0.14,40,2);
const spark=(x,y,col)=>burst(x,y,4,[col,'#ffffff'],1.6,0.05,10,1);
function puff(x,y){for(let i=0;i<5;i++)PART.push({x:x+rnd(-5,5),y:y-1,vx:rnd(-0.6,0.6),vy:rnd(-0.5,-0.1),life:18,max:18,col:'#e6c48a',sz:2,grav:0});}
function updateParticles(){
  for(const p of PART){p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.98;p.life--;}
  PART=PART.filter(p=>p.life>0);
}

/* ---------- Billy Reeves ---------- */
function toIdle(e){e.st='idle';e.tm=0;e.vx=0;}
function bossShot(e,hand){
  const ox=e.x+e.face*16,oy=e.y-26+(hand?5:-5),a=Math.atan2((P.y-10)-oy,P.x-ox);
  bulletE(ox,oy,a,e.ph===1?2.5:2.9,{r:2.5});burst(ox,oy,4,['#ffd24a','#ffffff'],1.4,0,8,2);sfx('efire');e.kick=4;e.hand=hand;
}
function bossFan(e,k,off){
  const ox=e.x+e.face*16,oy=e.y-26,base=Math.atan2((P.y-10)-oy,P.x-ox);
  for(let i=0;i<k;i++)bulletE(ox,oy,base+(i-(k-1)/2)*0.2+off,2.6,{r:2.5});
  sfx('efire');sfx('efire');e.kick=5;
}
function bossRing(e,off){
  for(let i=0;i<10;i++)bulletE(e.x,e.y-22,i/10*Math.PI*2+off,1.7,{r:2.5,col:'#ffd24a'});
  sfx('boom');G.shake=4;
}
function bossWaves(e){
  [-1,1].forEach(d=>BUL.push({x:e.x+d*14,y:e.y,vx:d*2.6,vy:0,wave:true,own:'e',life:210,dead:false,r:0}));
  sfx('wave');
}
AI.boss=function(e){
  const dx=P.x-e.x,face=dx>=0?1:-1;
  e.tm++;if(e.kick>0)e.kick--;
  if(!e.ph)e.ph=1;
  const ph=e.hp>e.max*0.66?1:(e.hp>e.max*0.33?2:3);
  if(e.st!=='wait'&&e.st!=='intro'&&e.st!=='dead'&&ph!==e.ph){
    e.ph=ph;
    if(ph>1){banner('','BILLY ESTÁ FURIOSO!',80,'#ff8a5a');G.shake=8;sfx('boom');burst(e.x,e.y-20,18,['#ff8a2a','#ffd24a'],3,0.05,30,3);}
  }
  e.vy=Math.min(e.vy+0.35,8);
  e.aimA=Math.atan2((P.y-10)-(e.y-26),dx);
  switch(e.st){
    case 'wait':e.face=face;break;
    case 'intro':
      e.face=face;
      if(e.tm===78){banner('FOGO!','',50,'#ff5a3c');sfx('fogo');G.shake=6;e.st='idle';e.tm=0;}
      break;
    case 'idle':{
      e.face=face;const ad=Math.abs(dx),want=ad>170?face:(ad<80?-face:0);
      e.vx=want*(0.55+e.ph*0.15);
      if(e.tm>64-e.ph*12){
        const pool=e.ph===1?['burst','burst','jump']:(e.ph===2?['burst','fan','charge','jump']:['fan','charge','slam','ring','burst']);
        let a=pick(pool);if(a===e.last)a=pick(pool);
        e.last=a;e.st=a;e.tm=0;e.vx=0;
      }
      break;}
    case 'burst':{
      e.vx=0;e.face=face;
      const n=e.ph===1?3:4,gap=e.ph===1?18:13;
      if(e.tm>=22&&(e.tm-22)%gap===0&&(e.tm-22)/gap<n)bossShot(e,((e.tm-22)/gap)%2);
      if(e.tm>22+gap*n+16)toIdle(e);
      break;}
    case 'fan':{
      e.vx=0;e.face=face;
      if(e.tm===26)bossFan(e,e.ph===3?7:5,0);
      if(e.ph===3&&e.tm===56)bossFan(e,7,0.14);
      if(e.tm>(e.ph===3?84:64))toIdle(e);
      break;}
    case 'charge':
      if(e.tm<30){e.vx=0;e.face=face;e.cdir=face;if(e.tm%6===0)puff(e.x,e.y);}
      else{
        if(e.tm===30)sfx('dash');
        e.vx=e.cdir*(e.ph===2?3.2:3.9);e.face=e.cdir;if(e.tm%5===0)puff(e.x-e.cdir*10,e.y);
        if(e.hitWall||e.tm>120){e.st='stun';e.tm=0;e.vx=0;G.shake=8;sfx('boom');burst(e.x+e.cdir*14,e.y-20,12,['#e6c48a','#ffffff'],2.5,0.1,26,2);}
      }
      break;
    case 'stun':e.vx=0;if(e.tm>46)toIdle(e);break;
    case 'jump':
      e.face=face;
      if(e.tm===1){e.vy=-7.8;e.vx=(Math.abs(dx)>120?face:-face)*2.3;sfx('jump');}
      if(e.tm>8&&e.onGround){e.vx=0;G.shake=6;puff(e.x,e.y);sfx('land');if(e.ph>=2)bossWaves(e);toIdle(e);}
      break;
    case 'slam':
      e.face=face;
      if(e.tm===1){e.vy=-10.5;e.vx=clamp(dx*0.025,-2.4,2.4);sfx('jump');}
      if(e.tm>14&&e.vy>0)e.vy+=0.5;
      if(e.tm>10&&e.onGround){e.vx=0;G.shake=12;sfx('boom');bossWaves(e);burst(e.x,e.y-4,14,['#e6c48a','#ffffff'],3,0.1,26,3);toIdle(e);}
      break;
    case 'ring':
      e.vx=0;e.face=face;
      if(e.tm===26)bossRing(e,0);
      if(e.tm===58)bossRing(e,Math.PI/10);
      if(e.tm>92)toIdle(e);
      break;
    case 'dead':
      e.vx=0;
      if(e.tm===170&&!G.flags.bossDead)startReward();
      break;
  }
  bodyMove(e,false);
};

function updateBullets(){
  for(const b of BUL){
    if(b.dead)continue;
    if(b.wave){
      b.x+=b.vx;b.life--;
      if(b.life<=0||b.x<-10||b.x>R.w*T+10)b.dead=true;
      if(!P.dead&&Math.abs(P.x-b.x)<(P.w+12)/2&&P.y>b.y-12&&P.y-P.h<b.y)hurtPlayer(1,b.x);
      continue;
    }
    if(b.homing)homingSteer(b);
    if(b.grav)b.vy+=b.grav;
    if(b.pick)b.rot+=0.35;
    const ox=b.x,oy=b.y;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.kind==='fire'&&G.t%2===0)PART.push({x:b.x,y:b.y,vx:rnd(-0.2,0.2),vy:rnd(-0.4,0),life:12,max:12,col:pick(['#ff8a2a','#ffd24a']),sz:2,grav:-0.01});
    if(b.life<=0)b.dead=true;
    if(solidTile(Math.floor(b.x/T),Math.floor(b.y/T),false)&&!(b.x<0||b.x>R.w*T)){
      if(b.bounce>0){
        b.bounce--;const hx=solidTile(Math.floor(b.x/T),Math.floor(oy/T),false),hy=solidTile(Math.floor(ox/T),Math.floor(b.y/T),false);
        if(hx)b.vx=-b.vx;if(hy)b.vy=-b.vy;if(!hx&&!hy){b.vx=-b.vx;b.vy=-b.vy;}
        b.x=ox;b.y=oy;spark(b.x,b.y,'#9ff09a');
      }else{b.dead=true;spark(b.x,b.y,b.own==='p'?'#ffe27a':'#ff6a4a');}
    }
    if(b.x<-30||b.x>R.w*T+30||b.y<-30||b.y>R.h*T+30)b.dead=true;
    if(b.dead)continue;
    if(b.own==='p'){
      for(const e of EN){
        if(e.dead)continue;
        if(e.t==='boss'&&(e.st==='wait'||e.st==='intro'||e.st==='dead'))continue;
        if(b.hit&&b.hit.indexOf(e)>=0)continue;
        if(inBox(b.x,b.y,e,b.r||1.5)){
          hitEnemy(b,e);
          if(b.pierce>0){b.pierce--;(b.hit=b.hit||[]).push(e);b.dmg*=0.8;}else b.dead=true;
          break;
        }
      }
    }else if(!P.dead&&inBox(b.x,b.y,P,b.r||2)){hurtPlayer(1,b.x);b.dead=true;}
  }
  BUL=BUL.filter(b=>!b.dead);
}

/* ---------- armas ---------- */
function gunPivot(p){const r=p.wp==='sg'?5:7;return [p.x+Math.cos(p.aim)*r,p.y-7+Math.sin(p.aim)*r];}
function fire(){
  const p=P,w=WP[p.wp],g=GUN[w.gun],a=p.aim,pv=gunPivot(p),ml=g.len-g.px;
  const mx=pv[0]+Math.cos(a)*ml,my=pv[1]+Math.sin(a)*ml;
  /* munição especial: gasta 1 do inventário por tiro */
  let kind='normal';const f=G.flags,sel=f.ammoSel;
  if(SHOTS[sel]){if(f.owned[sel])kind=sel;else f.ammoSel='normal';}
  else if(sel!=='normal'&&f.inv[sel]>0){f.inv[sel]--;kind=sel;if(f.inv[sel]<=0)f.ammoSel='normal';}
  const dm=w.dmg*dmgMul()*({pierce:1.2,bounce:0.9,homing:0.8,spread:0.6}[kind]||1),sp=spreadMul(),spd=speedMul();
  const mk1=(ang,s2,ox,oy,life,pierce)=>BUL.push({x:mx+ox,y:my+oy,vx:Math.cos(ang)*s2*spd,vy:Math.sin(ang)*s2*spd,own:'p',dmg:dm,life:(life||w.life)*(kind==='homing'?1.6:1),r:1.5,dead:false,kind,pierce:kind==='pierce'?(pierce||3):0,bounce:kind==='bounce'?3:0,homing:kind==='homing',hit:null});
  const fl=kind==='fire'?['#ff8a2a','#ffd24a','#ffffff']:(kind==='pierce'?['#9fe8ff','#ffffff']:['#ffd24a','#ff8a2a','#ffffff']);
  if(p.wp==='sg'){
    const n=w.pellets+(kind==='spread'?3:0),half=(n-1)/2,spr=w.spread*0.5*Math.pow(0.8,upl('prec'))*(kind==='spread'?1.4:1);
    for(let i=0;i<n;i++)mk1(a+(i-half)/half*spr+rnd(-0.05,0.05)*sp,w.spd+rnd(0,1.6),0,0,w.life+rint(-3,3),2);
    p.vx-=Math.cos(a)*2.4;if(!p.onGround)p.vy-=Math.sin(a)*0.6;
    G.shake=Math.max(G.shake,3);sfx('sg');burst(mx,my,8,fl,2.2,0.02,10,2);
  }else if(p.wp==='dual'){
    p.alt^=1;const s2=p.alt?3:-3;
    mk1(a+rnd(-0.08,0.08)*sp,w.spd,-Math.sin(a)*s2,Math.cos(a)*s2);if(kind==='spread'){mk1(a-0.2,w.spd,0,0);mk1(a+0.2,w.spd,0,0);}sfx('dual');burst(mx-Math.sin(a)*s2,my+Math.cos(a)*s2,3,fl,1.4,0,8,2);
  }else{
    mk1(a+rnd(-0.05,0.05)*sp,w.spd,0,0);if(kind==='spread'){mk1(a-0.2,w.spd,0,0);mk1(a+0.2,w.spd,0,0);}sfx('rev');burst(mx,my,4,fl,1.5,0,8,2);
  }
  p.ammo[p.wp]--;p.cd=Math.round(w.cd*cdMul());p.kick=3;
  PART.push({x:pv[0],y:pv[1],vx:-Math.cos(a)*0.6,vy:-1.2,life:30,max:30,col:'#e8c050',sz:1,grav:0.15});
  if(p.ammo[p.wp]<=0)p.cd=Math.max(p.cd,10);
}
function startReload(){if(P.reload>0||P.ammo[P.wp]>=magOf(P.wp))return;P.reload=Math.round(WP[P.wp].reload*reloadMul());sfx('reload');}
function setWp(k){if(avail().indexOf(k)<0||P.wp===k)return;P.wp=k;P.reload=0;P.sw=10;sfx('ui');}
function switchWp(d){const a=avail(),i=a.indexOf(P.wp);setWp(a[(i+d+a.length)%a.length]);}

/* ---------- jogador ---------- */
function updatePlayer(){
  const p=P;
  if(p.dead){p.vy=Math.min(p.vy+0.32,7);p.vx*=0.9;bodyMove(p,true);return;}
  if(p.inv>0)p.inv--;if(p.dashCd>0)p.dashCd--;if(p.cd>0)p.cd--;if(p.sw>0)p.sw--;if(p.sq>0)p.sq--;if(p.drop>0)p.drop--;
  if(p.kick>0)p.kick=Math.max(0,p.kick-0.6);
  const Lk=keys.KeyA||keys.ArrowLeft,Rk=keys.KeyD||keys.ArrowRight,dir=(Rk?1:0)-(Lk?1:0);
  const jumpHeld=keys.Space||keys.KeyW||keys.ArrowUp||keys.KeyZ;
  const jumpPress=pressed.Space||pressed.KeyW||pressed.ArrowUp||pressed.KeyZ;
  aimPlayer(p,dir);
  /* esquiva */
  if((pressed.ShiftLeft||pressed.ShiftRight||pressed.KeyK||pressed.KeyX)&&p.dashCd<=0&&p.dashT<=0){
    p.dashT=12;p.dashCd=36;p.dashDir=dir||p.face;sfx('dash');burst(p.x,p.y-4,6,['#e6b062','#f6d28e'],1.5,0.02,20,2);
  }
  if(p.dashT>0){p.dashT--;p.vx=p.dashDir*4.4;p.vy=0;}
  else{
    p.vx+=(dir*1.75-p.vx)*(p.onGround?0.28:0.16);
    if(Math.abs(p.vx)<0.05&&!dir)p.vx=0;
    p.vy=Math.min(p.vy+0.32,7.5);
  }
  /* pulo, pulo duplo, descer da tábua */
  if(p.onGround){p.coy=6;p.djUsed=false;}else if(p.coy>0)p.coy--;
  const onPlank=p.onGround&&oneWay(Math.floor(p.x/T),Math.floor((p.y+1)/T));
  if(jumpPress&&(keys.KeyS||keys.ArrowDown)&&onPlank){p.drop=10;p.y+=2;p.onGround=false;p.coy=0;p.jb=0;}
  else if(jumpPress)p.jb=7;else if(p.jb>0)p.jb--;
  if(p.jb>0&&p.dashT<=0){
    if(p.coy>0){p.vy=-6;p.coy=0;p.jb=0;p.onGround=false;sfx('jump');puff(p.x,p.y);}
    else if(!p.djUsed){p.vy=-5.5;p.djUsed=true;p.jb=0;sfx('dj');burst(p.x,p.y-2,10,['#bcd6ff','#ffffff'],1.8,0.02,20,2);}
  }
  if(!jumpHeld&&p.vy<-2.4&&p.dashT<=0)p.vy=-2.4;
  /* armas */
  const w=WP[p.wp];
  if(p.reload>0){p.reload--;if(p.reload===0){p.ammo[p.wp]=magOf(p.wp);sfx('reload2');}}
  if(pressed.KeyR)startReload();
  if(pressed.KeyQ)switchWp(1);
  if(pressed.KeyF)cycleAmmo();
  if(mouse.wheel)switchWp(mouse.wheel>0?1:-1);
  if(pressed.Digit1)setWp('rev');if(pressed.Digit2)setWp('sg');if(pressed.Digit3)setWp('dual');
  if((mouse.down||keys.KeyJ||TOUCH.shoot)&&p.cd<=0&&p.reload===0&&p.sw<=0&&p.dashT<=0){
    if(p.ammo[p.wp]>0)fire();else startReload();
  }
  p.pvy=p.vy;const was=p.onGround;
  bodyMove(p,true);
  if(p.onGround&&!was&&p.pvy>2.5){p.sq=8;puff(p.x,p.y);sfx('land');}
  checkSecrets();
  p.anim+=Math.abs(p.vx)*0.12;
  if(p.onGround&&Math.abs(p.vx)>1.2&&G.t%9===0)puff(p.x-Math.sign(p.vx)*4,p.y);
}
function updateCam(snap){
  const aimx=TOUCH.on?P.face*40:clamp((mouse.x-W/2)*0.3,-60,60),aimy=TOUCH.on?0:clamp((mouse.y-H/2)*0.18,-30,30);
  const tx=clamp(P.x-W/2+aimx,0,Math.max(0,R.w*T-W));

function enterRoom(id,x,y,face){

function ensureFlags(){
  const f=G.flags;
  f.items=f.items||{};
  f.up=Object.assign({prec:0,rate:0,life:0,dmg:0,mag:0,luck:0},f.up||{});
  f.picked=f.picked||{};
  f.inv=Object.assign({pierce:0,fire:0},f.inv||{});
  f.ammoSel=f.ammoSel||'normal';
  f.coins=f.coins||0;
  ['killed','camps','secrets','owned','opened','bags'].forEach(k=>{f[k]=f[k]||{};});
}
const upl=k=>(G.flags.up&&G.flags.up[k])||0;
const cardsN=()=>3+Object.keys(G.flags.items).filter(k=>k.indexOf('heart')===0).length+upl('life')+(G.flags.owned&&G.flags.owned.card?1:0);
const maxHp=()=>2*cardsN();
const magOf=wp=>WP[wp].mag+(wp==='sg'?upl('mag'):upl('mag')*2);
const fullAmmo=()=>({rev:magOf('rev'),sg:magOf('sg'),dual:magOf('dual')});
const dmgMul=()=>1+0.2*upl('dmg');
const cdMul=()=>Math.pow(0.85,upl('rate'));
const reloadMul=()=>Math.pow(0.88,upl('rate'))*(G.flags.owned&&G.flags.owned.powder?0.7:1);
const spreadMul=()=>Math.pow(0.6,upl('prec'));
const speedMul=()=>1+0.07*upl('prec');
const luckMul=()=>1+0.5*upl('luck');

let PK=[],AMB=[],FTXT=[],HUDP=[],hudShake=0;

/* ---------- cartas de melhoria antes de cada fase ---------- */
function offerCards(id){
  const first=Object.keys(G.flags.picked).length===0&&id==='estrada';
  const pool=Object.keys(UPS).filter(k=>upl(k)<UPS[k].max);
  let opts=[];
  if(first)opts=['prec','rate','life'];
  else while(opts.length<3&&pool.length)opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if(!opts.length){G.flags.picked[id]=true;return;}
  G.cards={id,opts,sel:1,t:0};
  G.state='cards';sfx('card');
}
function pickCard(k){
  G.flags.up[k]++;G.flags.picked[G.cards.id]=true;
  if(k==='life')P.hp=maxHp();
  if(k==='mag')P.ammo=fullAmmo();
  sfx('pick');banner('CARTA: '+UPS[k].name,'Nível '+G.flags.up[k]+' de '+UPS[k].max,150,'#ffe27a');
  G.cards=null;G.state='play';save();
}
function cardRect(i){return {x:62+i*124,y:62,w:104,h:150};}
function updateCards(){
  const c=G.cards;c.t++;
  if(c.t<48)return;
  if(pressed.KeyA||pressed.ArrowLeft){c.sel=(c.sel+2)%3;sfx('ui');}
  if(pressed.KeyD||pressed.ArrowRight){c.sel=(c.sel+1)%3;sfx('ui');}
  if(pressed.Digit1){c.sel=0;pickCard(c.opts[0]);return;}
  if(pressed.Digit2&&c.opts.length>1){c.sel=1;pickCard(c.opts[1]);return;}
  if(pressed.Digit3&&c.opts.length>2){c.sel=2;pickCard(c.opts[2]);return;}
  for(let i=0;i<c.opts.length;i++){
    const r=cardRect(i);
    if(mouse.x>=r.x&&mouse.x<r.x+r.w&&mouse.y>=r.y-10&&mouse.y<r.y+r.h){if(c.sel!==i){c.sel=i;sfx('ui');}if(mouse.click){pickCard(c.opts[i]);return;}}
  }
  if(pressed.Enter||pressed.Space)pickCard(c.opts[Math.min(c.sel,c.opts.length-1)]);
}

/* ---------- inventário ---------- */
function invSlots(){
  const s=[];
  ['rev','sg','dual'].forEach((k,i)=>s.push({kind:'wp',id:k,x:30+i*58,y:84,w:52,h:44}));
  AMMO_ORDER.forEach((k,i)=>s.push({kind:'ammo',id:k,x:30+(i%3)*58,y:146+Math.floor(i/3)*50,w:52,h:44}));
  return s;
}
const AMMO_ORDER=['normal','bounce','homing','spread','pierce','fire'];
const ammoAvail=k=>k==='normal'||(SHOTS[k]?!!G.flags.owned[k]:G.flags.inv[k]>0);
function cycleAmmo(){
  const f=G.flags,order=AMMO_ORDER.filter(ammoAvail);
  const i=order.indexOf(f.ammoSel);f.ammoSel=order[(i+1)%order.length];sfx('equip');
}
function equipAmmo(k){if(ammoAvail(k)){G.flags.ammoSel=k;sfx('equip');}else sfx('ui');}
function updateInv(){
  if(pressed.KeyI||pressed.Escape||pressed.Tab||(mouse.click&&inR(closeRect,mouse.x,mouse.y))){G.state='play';sfx('ui');return;}
  if(mouse.click){
    for(const s of invSlots()){
      if(mouse.x>=s.x&&mouse.x<s.x+s.w&&mouse.y>=s.y&&mouse.y<s.y+s.h){
        if(s.kind==='wp'){if(avail().indexOf(s.id)>=0)setWp(s.id);}
        else equipAmmo(s.id);
      }
    }
  }
  if(pressed.KeyF)cycleAmmo();
  if(pressed.KeyQ)switchWp(1);
}

/* ---------- cartas de vida (HUD): rasgam ao tomar dano ---------- */
const cardX=ci=>10+ci*13;
function tearCards(from,to){
  for(let h=from;h>to;h--){
    const ci=Math.floor((h-1)/2),x=cardX(ci),y=8,si=ci%3;
    if(h%2===0){
      HUDP.push({img:CARDS[si].corner,x,y,vx:rnd(0.6,1.3),vy:-1.6,r:0,vr:rnd(0.06,0.14),life:70});
    }else{
      HUDP.push({img:CARDS[si].halfA,x,y,vx:-rnd(0.5,1),vy:-1.8,r:0,vr:-rnd(0.05,0.12),life:70});
      HUDP.push({img:CARDS[si].halfB,x,y,vx:rnd(0.5,1),vy:-1.4,r:0,vr:rnd(0.05,0.12),life:70});
    }
  }
  hudShake=12;sfx('tear');
}
function updateHudFx(){
  for(const p of HUDP){p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.r+=p.vr;p.life--;}
  HUDP=HUDP.filter(p=>p.life>0);
  if(hudShake>0)hudShake--;
}

/* ---------- drops e pickups ---------- */
function spawnPK(x,y,kind,n){PK.push({x,y,w:8,h:8,vx:rnd(-1.6,1.6),vy:rnd(-3.6,-2),kind,n,t:0,life:760,onGround:false,hitWall:false});}
function ftext(x,y,t,col){FTXT.push({x,y,t,col,age:0});}
function dropLoot(e){
  if(e.t==='boss'){
    for(let i=0;i<6;i++){spawnPK(e.x,e.y-24,'pierce',3);spawnPK(e.x,e.y-24,'fire',3);}
    spawnPK(e.x,e.y-24,'tape',1);spawnPK(e.x,e.y-24,'tape',1);
    return;
  }
  if(e.t==='tnt')return;
  if(Math.random()>0.3*luckMul())return;
  const r=Math.random();
  let kind=r<0.4?'pierce':(r<0.8?'fire':'tape');
  if(kind==='tape'&&P.hp>=maxHp()&&Math.random()<0.6)kind=Math.random()<0.5?'pierce':'fire';
  spawnPK(e.x,e.y-10,kind,kind==='tape'?1:rint(3,5));
}
function gainPK(p){
  const I=G.flags.inv;
  if(p.kind==='coin'){G.flags.coins+=p.n;ftext(p.x,p.y-8,'+'+p.n,'#ffd24a');sfx('pickup');return;}
  if(p.kind==='pierce'){I.pierce=Math.min(99,I.pierce+p.n);ftext(p.x,p.y-8,'+'+p.n+' PERFURANTE','#9fe8ff');}
  else if(p.kind==='fire'){I.fire=Math.min(99,I.fire+p.n);ftext(p.x,p.y-8,'+'+p.n+' DE FOGO','#ff9a4a');}
  else{P.hp=Math.min(maxHp(),P.hp+1);ftext(p.x,p.y-8,'FITA: +1 RASGO','#ffe9b0');burst(P.x,P.y-12,10,['#ffffff','#ffe9b0'],1.6,-0.02,30,2);}
  sfx('pickup');
}
function updatePK(){
  for(const p of PK){
    p.t++;p.vy=Math.min(p.vy+0.22,5);
    const dx=P.x-p.x,dy=(P.y-9)-(p.y-4),d=Math.hypot(dx,dy);
    const wants=!(p.kind==='tape'&&P.hp>=maxHp());
    if(wants&&d<48&&!P.dead&&p.t>25){p.vx+=dx/(d||1)*0.28;p.vy+=dy/(d||1)*0.2;p.vx*=0.95;}
    bodyMove(p,false);
    if(p.onGround)p.vx*=0.8;
    if(p.hitWall)p.vx=-p.vx*0.5;
    if(wants&&!P.dead&&p.t>14&&Math.abs(P.x-p.x)<11&&Math.abs((P.y-9)-(p.y-4))<14){gainPK(p);p.gone=true;}
    if(p.t>p.life)p.gone=true;
  }
  PK=PK.filter(p=>!p.gone);
  for(const f of FTXT){f.age++;f.y-=0.35;}
  FTXT=FTXT.filter(f=>f.age<60);
}

/* ---------- fogo e perfuração ---------- */
function ignite(e){
  if(e.t==='tnt'){killEnemy(e);return;}
  if(!(e.burn>0))sfx('ignite');
  e.burn=e.t==='boss'?120:180;
}
function hitEnemy(b,e){
  dmgEnemy(e,b.dmg,b.x);
  if(b.kind==='fire'&&!e.dead)ignite(e);
  spark(b.x,b.y,b.kind==='fire'?'#ff8a2a':(b.kind==='pierce'?'#9fe8ff':'#ffe27a'));
}
function burnTick(e){
  e.burn--;
  if(e.burn%4===0)PART.push({x:e.x+rnd(-5,5),y:e.y-rnd(4,e.h),vx:rnd(-0.2,0.2),vy:rnd(-1.1,-0.5),life:18,max:18,col:pick(['#ff8a2a','#ffd24a','#e8322a']),sz:2,grav:-0.02});
  if(e.burn%15===0){
    e.hp-=(e.t==='boss'?0.25:0.4);e.flash=2;e.hurtT=150;
    if(e.hp<=0&&!e.dead&&e.st!=='dead'){killEnemy(e);return true;}
  }
  return false;
}

function openShop(id){G.shop={id,sel:0,t:0,msg:SHOPS[id].line};G.state='shop';sfx('ui');}
function shopSlot(i){return {x:30+i*108,y:126,w:96,h:72};}
function buy(k){
  const it=ITEMS[k],f=G.flags;
  if(it.kind!=='cons'&&f.owned[k]){G.shop.msg='Você já tem isso, parceiro.';sfx('ui');return;}
  if(f.coins<it.price){G.shop.msg='Faltam '+(it.price-f.coins)+' moedas.';sfx('ui');return;}
  f.coins-=it.price;
  if(k==='ammo'){f.inv.pierce=Math.min(99,f.inv.pierce+10);f.inv.fire=Math.min(99,f.inv.fire+10);}
  else if(k==='tape')P.hp=maxHp();
  else{f.owned[k]=true;if(k==='card')P.hp=maxHp();if(SHOTS[k])f.ammoSel=k;}
  G.shop.msg='Negócio fechado! Volte sempre.';sfx('pick');save();
}
const closeRect={x:W-26,y:6,w:20,h:20};
const inR=(r,x,y)=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
function updateShop(){
  const sh=G.shop,items=SHOPS[sh.id].items;sh.t++;
  if(pressed.Escape||(pressed.KeyE&&sh.t>10)||(mouse.click&&inR(closeRect,mouse.x,mouse.y))){G.state='play';G.shop=null;sfx('ui');return;}
  if(pressed.KeyA||pressed.ArrowLeft){sh.sel=(sh.sel+items.length-1)%items.length;sfx('ui');}
  if(pressed.KeyD||pressed.ArrowRight){sh.sel=(sh.sel+1)%items.length;sfx('ui');}
  if(pressed.Enter||pressed.Space)buy(items[sh.sel]);
  for(let i=0;i<items.length;i++){
    const r=shopSlot(i);
    if(inR(r,mouse.x,mouse.y)){if(mouse.click){if(sh.sel===i||!TOUCH.on)buy(items[i]);sh.sel=i;}else if(!TOUCH.on&&sh.sel!==i){sh.sel=i;}}
  }
}

/* ---------- mapa (pan + viagem rápida) ---------- */
const MK=0.5;
function travelList(){return Object.keys(G.flags.camps).filter(id=>ROOMS[id]&&MPOS[id]);}
function firePos(id){const c=G.flags.camps[id];return {x:MPOS[id].x+c.x/T,y:MPOS[id].y+c.y/T};}
function centerMapOn(id,useFire){
  if(!MPOS[id])return;
  if(useFire&&G.flags.camps[id]){const f=firePos(id);G.mapView={x:f.x,y:f.y};}
  else G.mapView={x:MPOS[id].x+RDIM[id][0]/2,y:MPOS[id].y+RDIM[id][1]/3};
}
function openMap(){G.state='map';G.mapMode='view';centerMapOn(R.id);G.mapView.x=MPOS[R.id].x+P.x/T;}
function openTravel(){
  const l=travelList();G.state='map';G.mapMode='travel';G.mapSel=Math.max(0,l.indexOf(R.id));
  if(l.length)centerMapOn(l[G.mapSel],true);else centerMapOn(R.id);
}
function travelTo(id){
  const c=G.flags.camps[id];G.state='play';G.mapMode='view';sfx('ui');
  fadeTo(()=>enterRoom(id,c.x,c.y));
}
const m2s=(x,y)=>({x:Math.round((x-G.mapView.x)*MK+W/2),y:Math.round((y-G.mapView.y)*MK+H/2+6)});
function updateMap(){
  const mv=G.mapView,trav=G.mapMode==='travel';
  if(pressed.Escape||(!trav&&(pressed.KeyM||pressed.Tab))||(mouse.click&&inR(closeRect,mouse.x,mouse.y))){G.state='play';G.mapMode='view';return;}
  if(trav){
    const l=travelList();
    if(l.length){
      if(pressed.KeyA||pressed.ArrowLeft||pressed.KeyW||pressed.ArrowUp){G.mapSel=(G.mapSel+l.length-1)%l.length;centerMapOn(l[G.mapSel],true);sfx('ui');}
      if(pressed.KeyD||pressed.ArrowRight||pressed.KeyS||pressed.ArrowDown){G.mapSel=(G.mapSel+1)%l.length;centerMapOn(l[G.mapSel],true);sfx('ui');}
      if(pressed.Enter||pressed.Space){travelTo(l[G.mapSel]);return;}
      if(mouse.click)for(let i=0;i<l.length;i++){const f=firePos(l[i]),p=m2s(f.x,f.y);if(Math.hypot(mouse.x-p.x,mouse.y-p.y)<12){if(G.mapSel===i||!TOUCH.on){travelTo(l[i]);return;}G.mapSel=i;}}
    }
  }else{
    const sp=4;
    if(keys.KeyA||keys.ArrowLeft)mv.x-=sp;if(keys.KeyD||keys.ArrowRight)mv.x+=sp;
    if(keys.KeyW||keys.ArrowUp)mv.y-=sp;if(keys.KeyS||keys.ArrowDown)mv.y+=sp;
  }
  if(mouse.down){if(G.mapDrag){mv.x-=(mouse.x-G.mapDrag.x)/MK;mv.y-=(mouse.y-G.mapDrag.y)/MK;}G.mapDrag={x:mouse.x,y:mouse.y};}else G.mapDrag=null;
  mv.x=clamp(mv.x,-40,MPOS.trem.x+RDIM.trem[0]+40);mv.y=clamp(mv.y,-90,90);
}

/* ---------- segredos: paredes falsas ---------- */
function checkSecrets(){
  if(!R.fakes||!R.fakes.length)return;
  const x0=Math.floor((P.x-P.w/2)/T),x1=Math.floor((P.x+P.w/2-0.01)/T),y0=Math.floor((P.y-P.h)/T),y1=Math.floor((P.y-0.01)/T);
  for(const f of R.fakes){
    if(G.flags.secrets[f.id])continue;
    if(x1>=f.x&&x0<f.x+f.w&&y1>=f.y&&y0<f.y+f.h){
      G.flags.secrets[f.id]=true;blk(R,f.x,f.y,f.w,f.h,'.');renderTiles(R);
      banner('ÁREA SECRETA!','',140,'#9fe8ff');sfx('pick');
      burst((f.x+f.w/2)*T,(f.y+f.h/2)*T,22,['#a07f68','#745644','#e6c48a'],2.6,0.12,40,3);save();
    }
  }
}

/* ---------- tiro teleguiado e mira ---------- */
const hittable=e=>!e.dead&&!(e.t==='boss'&&(e.st==='wait'||e.st==='intro'||e.st==='dead'));
function homingSteer(b){
  let best=null,bd=170;
  for(const e of EN){if(!hittable(e)||e.t==='tnt')continue;const d=Math.hypot(e.x-b.x,(e.y-e.h/2)-b.y);if(d<bd){bd=d;best=e;}}
  if(!best)return;
  const sp=Math.hypot(b.vx,b.vy),cur=Math.atan2(b.vy,b.vx);
  let d=Math.atan2((best.y-best.h/2)-b.y,best.x-b.x)-cur;
  while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
  const na=cur+clamp(d,-0.09,0.09);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
}
function autoTarget(p){
  let best=null,bd=270;
  for(const e of EN){
    if(!hittable(e))continue;
    const ey=e.y-e.h/2,d=Math.hypot(e.x-p.x,ey-(p.y-9));
    if(d<bd&&clearLine(p.x,p.y-9,e.x,ey)){bd=d;best=e;}
  }
  return best;
}
function aimPlayer(p,dir){

    const t=autoTarget(p);p.autoT=t;
    if(t){p.aim=Math.atan2((t.y-t.h/2)-(p.y-9),t.x-p.x);p.face=t.x>=p.x?1:-1;}
    else{if(dir)p.face=dir;p.aim=p.face>0?0:Math.PI;}
  }else{
    const mx=mouse.x+cam.x,my=mouse.y+cam.y;p.autoT=null;
    p.aim=Math.atan2(my-(p.y-9),mx-p.x);p.face=mx>=p.x?1:-1;

/* ---------- controles de toque (celular) ---------- */
const TOUCH={on:false,shoot:false,stick:null,btn:{},portrait:false};
const TBTN=[
  {id:'jump',x:W-44,y:H-42,r:22,label:'PULO',key:'Space'},
  {id:'shoot',x:W-96,y:H-58,r:21,label:'TIRO',hold:true},
  {id:'dash',x:W-46,y:H-96,r:15,label:'DASH',key:'ShiftLeft'},
  {id:'reload',x:W-96,y:H-102,r:12,label:'R',key:'KeyR'},
  {id:'wp',x:W-140,y:H-28,r:13,label:'ARMA',key:'KeyQ'},
  {id:'ammo',x:W-142,y:H-68,r:12,label:'MUN',key:'KeyF'},
  {id:'act',x:W-148,y:H-112,r:16,label:'E',key:'KeyE',ctx:true},
  {id:'pause',x:W-14,y:14,r:10,label:'II',key:'Escape'},
  {id:'map',x:W-40,y:14,r:10,label:'M',key:'KeyM'},
  {id:'inv',x:W-66,y:14,r:10,label:'I',key:'KeyI'}
];
function tpos(t){const r=cv.getBoundingClientRect();return {x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function touchDown(id,p){
  const playing=G.state==='play'&&P&&!P.dead&&!G.fade;
  if(playing){
    for(const b of TBTN){
      if(b.ctx&&!(G.hint&&G.hint.type==='act'))continue;
      if(Math.hypot(p.x-b.x,p.y-b.y)<=b.r+7){
        TOUCH.btn[id]=b;
        if(b.hold)TOUCH.shoot=true;else{keys[b.key]=true;pressed[b.key]=true;}
        return;
      }
    }
    if(p.x<W*0.5){TOUCH.stick={id,x0:p.x,y0:p.y,x:p.x,y:p.y};return;}
    return;
  }
  mouse.x=p.x;mouse.y=p.y;mouse.click=true;mouse.down=true;TOUCH.tap=id;
}
function touchMove(id,p){
  if(TOUCH.stick&&TOUCH.stick.id===id){TOUCH.stick.x=p.x;TOUCH.stick.y=p.y;}
  if(TOUCH.tap===id){mouse.x=p.x;mouse.y=p.y;}
}
function touchUp(id){
  const b=TOUCH.btn[id];
  if(b){if(b.hold)TOUCH.shoot=false;else keys[b.key]=false;delete TOUCH.btn[id];}
  if(TOUCH.stick&&TOUCH.stick.id===id){TOUCH.stick=null;['KeyA','KeyD','KeyS'].forEach(k=>keys[k]=false);}
  if(TOUCH.tap===id){mouse.down=false;TOUCH.tap=null;}
}
function setKey(k,v){if(v&&!keys[k])pressed[k]=true;keys[k]=v;}
function applyTouch(){
  if(!TOUCH.on)return;
  TOUCH.portrait=(window.innerHeight||1)>(window.innerWidth||1);
  const s=TOUCH.stick;
  if(s){const dx=clamp((s.x-s.x0)/26,-1,1),dy=clamp((s.y-s.y0)/26,-1,1);setKey('KeyD',dx>0.35);setKey('KeyA',dx<-0.35);setKey('KeyS',dy>0.6);}
  if(G.state!=='play'){TOUCH.shoot=false;}
}
cv.addEventListener('touchstart',e=>{e.preventDefault();TOUCH.on=true;initAudio();for(const t of e.changedTouches)touchDown(t.identifier,tpos(t));},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)touchMove(t.identifier,tpos(t));},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)touchUp(t.identifier);},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)touchUp(t.identifier);},{passive:false});

function txt(s,x,y,col,size,align,sh){
  ctx.font=(size||8)+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='top';
  if(sh!==null){ctx.fillStyle=sh||'#000';ctx.fillText(s,Math.round(x)+1,Math.round(y)+1);}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,Math.round(x),Math.round(y));
}
function bigTxt(s,x,y,size,fill,shadow){
  ctx.font=size+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
  const o=Math.max(2,Math.round(size/10));
  ctx.fillStyle='#120704';
  for(let dx=-o;dx<=o;dx+=o)for(let dy=-o;dy<=o;dy+=o)ctx.fillText(s,Math.round(x)+dx,Math.round(y)+dy);
  ctx.fillStyle=shadow||'#7a2a10';ctx.fillText(s,Math.round(x)+o,Math.round(y)+o+1);
  ctx.fillStyle=fill;ctx.fillText(s,Math.round(x),Math.round(y));
}
function wrap(s,n){
  const out=[];let line='';
  for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w;}else line=(line+' '+w).trim();}
  if(line)out.push(line);return out;
}
function panel(x,y,w,h){
  rc(ctx,'#000',x-2,y-2,w+4,h+4);rc(ctx,'#e0a93a',x-1,y-1,w+2,h+2);rc(ctx,'#1d1008',x,y,w,h);

}
function drawSpr(img,x,y,face,sx,sy,rot){
  ctx.save();ctx.translate(Math.round(x),Math.round(y));
  if(rot)ctx.rotate(rot);
  ctx.scale((face||1)*(sx||1),sy||1);
  ctx.drawImage(img,-Math.floor(img.width/2),-img.height);
  ctx.restore();
}
function drawGun(g,x,y,ang,kick,sc){
  const k=GUN[g];
  ctx.save();ctx.translate(Math.round(x-Math.cos(ang)*(kick||0)),Math.round(y-Math.sin(ang)*(kick||0)));
  ctx.rotate(ang);if(Math.cos(ang)<0)ctx.scale(1,-1);
  if(sc)ctx.scale(sc,sc);
  ctx.drawImage(k.img,-k.px,-k.py);ctx.restore();
}
function disc(x,y,r,col){ctx.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+0.5));ctx.fillRect(Math.round(x-w),Math.round(y+dy),w*2+1,1);}}

/* ---------- jogador ---------- */
function drawPlayer(){
  const p=P;
  if(p.dead){drawSpr(S.player,p.x,p.y,p.face,1.2,0.28,0);return;}
  if(p.inv>0&&p.dashT<=0&&Math.floor(p.inv/4)%2===0)return;
  const moving=Math.abs(p.vx)>0.4&&p.onGround;
  let sx=1,sy=1,rot=p.vx*0.035,by=0;
  if(moving){by=-Math.abs(Math.sin(p.anim*2))*1.5;sy=1+Math.sin(p.anim*4)*0.04;}
  if(!p.onGround){sy=p.vy<0?1.1:0.95;sx=p.vy<0?0.92:1.04;}
  if(p.sq>0){sy=0.84;sx=1.14;}
  if(p.dashT>0){
    sx=1.2;sy=0.85;rot=p.dashDir*0.12;
    ctx.globalAlpha=0.3;for(let i=1;i<=3;i++)drawSpr(S.player,p.x-p.dashDir*i*7,p.y,p.face,1,1,0);ctx.globalAlpha=1;
  }
  drawSpr(S.player,p.x,p.y+by,p.face,sx,sy,rot);
  const pv=gunPivot(p),g=WP[p.wp].gun;
  if(p.wp==='dual'){
    const nx=-Math.sin(p.aim),ny=Math.cos(p.aim);
    drawGun(g,pv[0]+nx*-3,pv[1]+ny*-3+by,p.aim,p.alt?0:p.kick);
    drawGun(g,pv[0]+nx*3,pv[1]+ny*3+by,p.aim,p.alt?p.kick:0);
  }else drawGun(g,pv[0],pv[1]+by,p.aim,p.kick);
  if(p.reload>0){
    const f=1-p.reload/WP[p.wp].reload;
    rc(ctx,'#000',p.x-10,p.y-30,20,4);rc(ctx,'#3a2a28',p.x-9,p.y-29,18,2);rc(ctx,'#ffe27a',p.x-9,p.y-29,Math.round(18*f),2);
  }
}
