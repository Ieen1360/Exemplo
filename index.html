  /* título */
  const bob=Math.round(Math.sin(G.t*0.05)*2);
  bigTxt('OLD WEST',W/2,34+bob,40,'#f7c04a','#8a2a10');
  txt('A LENDA DO VELHO XERIFE',W/2,86,'#ffe9b0',8,'center');
  const items=menuItems();
  items.forEach((s,i)=>{
    const y=130+i*24,sel=G.menu===i;
    if(sel){rc(ctx,'#000',W/2-86,y-5,172,20);rc(ctx,'#e0a93a',W/2-85,y-4,170,18);rc(ctx,'#2a1608',W/2-84,y-3,168,16);}
    txt(s,W/2,y,sel?'#ffe27a':'#d8c090',8,'center');
    if(sel&&Math.floor(G.t/18)%2===0){txt('>',W/2-78,y,'#ff5a3a',8);txt('<',W/2+70,y,'#ff5a3a',8);}
  });
  txt(TOUCH.on?'toque para escolher':'W/S + ENTER ou clique',W/2,190,'#ffe9b0',8,'center');
}
const STORY=[
  {th:'day',scene:'hero',txt:'Anos atrás, o xerife era a lenda de Pão Duro, a cidade mais tranquila do Velho Oeste.'},
  {th:'sunset',scene:'hero',txt:'Mas o tempo passou. Ele guardou a estrela, pendurou o revólver e esperou que a paz durasse para sempre.'},
  {th:'night',scene:'gang',txt:'A paz não durou. Numa noite escura, o Bando Reeves chegou e tomou a cidade inteira.'},
  {th:'sunset',scene:'billy',txt:'O chefe, Billy Reeves, o pistoleiro dos dois revólveres, fez do saloon o seu quartel-general.'},
  {th:'sunset',scene:'hero',txt:'Hoje o velho xerife desce a colina com o chapéu na cabeça. Pão Duro vai ter a sua lei de volta.'}
];
function drawStory(){
  const s=STORY[G.story],th=THEMES[s.th],I=titleImgs();
  drawBG(th,G.storyT*0.25,0,G.storyT);
  groundStrip(H-96,th.sand[1],th.sand[2],th.sand[4]);
  if(s.scene==='hero'){
    ctx.drawImage(I.hero,W/2-36+Math.round(Math.sin(G.storyT*0.04)*0),H-96-84);
    /* estrela de xerife flutuando */
    const sy=H-96-110+Math.round(Math.sin(G.storyT*0.06)*3);
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;rc(ctx,'#ffd24a',W/2+Math.cos(a)*10-2,sy+Math.sin(a)*10-2,5,5);}
    rc(ctx,'#fff3a0',W/2-3,sy-3,7,7);
  }else if(s.scene==='gang'){
    for(let i=0;i<4;i++){
      const x=W+30-((G.storyT*0.9+i*60)%(W+160))+i*0,y=H-96+(i%2)*4;
      ctx.drawImage(I.band,Math.round(x-27),y-63+0);
    }
    disc(380,60,22,'#c03a3a');disc(380,60,18,'#e06060');
  }else{
    ctx.drawImage(I.bossBig,W/2-36,H-96-84);
    for(let k=0;k<2;k++){
      const sd=k?1:-1;ctx.save();ctx.translate(W/2+sd*58,H-96-40);ctx.rotate(sd>0?0.3:Math.PI-0.3);if(sd<0)ctx.scale(1,-1);ctx.scale(2,2);ctx.drawImage(GUN.rev.img,-GUN.rev.px,-GUN.rev.py);ctx.restore();
    }
  }
  panel(24,H-86,W-48,70);
  const ls=wrap(s.txt,50);let rem=Math.floor(G.storyT*0.7);
  ls.forEach((l,i)=>{txt(l.slice(0,Math.max(0,rem)),40,H-76+i*13,'#f3e3b8',8);rem-=l.length+1;});
  if(Math.floor(G.t/24)%2===0)txt('ENTER',W-40,H-28,'#e0a93a',8,'right',null);
  txt((G.story+1)+'/'+STORY.length,40,H-28,'#8a6a40',8,'left',null);
}
function drawDialog(){
  const d=G.dlg,full=d.lines[d.i];
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);
  panel(24,38,W-48,64);
  const ls=wrap(full,50);let rem=Math.floor(d.n);
  ls.forEach((l,i)=>{txt(l.slice(0,Math.max(0,rem)),40,50+i*13,'#f3e3b8',8);rem-=l.length+1;});
  if(d.n>=full.length&&Math.floor(G.t/24)%2===0)txt('ENTER',W-40,84,'#e0a93a',8,'right',null);
}
function drawPause(){
  ctx.fillStyle='rgba(10,5,2,0.84)';ctx.fillRect(0,0,W,H);
  bigTxt('PAUSADO',W/2,14,24,'#f7c04a','#8a2a10');
  const L=[['A / D','andar'],['ESPAÇO / W','pular (de novo no ar com as esporas)'],['SHIFT','esquiva (invulnerável)'],['MOUSE','mirar (a mira é a bolinha)'],['CLIQUE','atirar (segure para automático)'],['Q / RODINHA','trocar de arma (1, 2, 3)'],['F','trocar de munição'],['R','recarregar'],['E','banco, porta e placas'],['S + PULO','descer de uma tábua'],['I','inventário'],['M','mapa']];
  L.forEach((r,i)=>{txt(r[0],50,56+i*12,'#ffe27a',8);txt(r[1],170,56+i*12,'#d8c090',8);});
  txt('N  música: '+(musicOn?'LIGADA':'desligada'),50,206,musicOn?'#9fe8a0':'#9a8560',8);
  txt('B  efeitos: '+(sfxOn?'LIGADOS':'desligados'),270,206,sfxOn?'#9fe8a0':'#9a8560',8);
  txt('ESC ou ENTER: continuar    T: voltar ao título',W/2,H-30,'#e8c880',8,'center');
}
/* =====================================================================
   FLUXO DO JOGO
   ===================================================================== */
function fadeTo(cb){if(G.fade&&G.fade.dir>0)return;G.fade={a:G.fade?G.fade.a:0,dir:1,cb};}
function updateFade(){
  const f=G.fade;f.a+=f.dir*0.08;
  if(f.dir>0&&f.a>=1){f.a=1;f.dir=-1;if(f.cb){const cb=f.cb;f.cb=null;cb();}}
  else if(f.dir<0&&f.a<=0)G.fade=null;
}
function startNew(){
  G.flags={bossDead:false,dj:false,dual:false,items:{}};ensureFlags();G.visited={};G.cp={room:'estrada',x:7*T+8,y:14*T};
  P=newPlayer();G.state='story';G.story=0;G.storyT=0;initAudio();sfx('ui');
}
function startContinue(){
  const s=loadSave();if(!s){startNew();return;}
  G.flags=Object.assign({bossDead:false,dj:false,dual:false,items:{}},s.flags);G.visited=s.visited||{};
  if(!s.flags.picked){G.flags.picked={};for(const k in G.visited)G.flags.picked[k]=true;}
  ensureFlags();G.cp=s.cp||{room:'estrada',x:7*T+8,y:14*T};
  if(s.ver!==3||!ROOMS[G.cp.room]){const rm=ROOMS[G.cp.room]?G.cp.room:'estrada',fd=ROOMS[rm]().defs.find(d=>d.t==='fire');G.cp=fd?{room:rm,x:fd.x,y:fd.y}:{room:'estrada',x:8*T+8,y:14*T};}
  P=newPlayer();initAudio();sfx('ui');beginPlay();
}
function beginPlay(){
  G.state='play';G.bossFight=false;G.ghost=null;
  enterRoom(G.cp.room,G.cp.x,G.cp.y);P.hp=maxHp();
  G.fade={a:1,dir:-1,cb:null};
}
function respawn(){
  if(G.fade)return;
  fadeTo(()=>{const wp=P.wp;P=newPlayer();P.wp=wp;G.ghost=null;G.deadT=0;enterRoom(G.cp.room,G.cp.x,G.cp.y);P.inv=60;});
}
function chooseMenu(i){const it=menuItems()[i];if(it==='CONTINUAR')startContinue();else startNew();}
function updateTitle(){
  const items=menuItems();
  if(G.menu>=items.length)G.menu=0;
  if(pressed.KeyS||pressed.ArrowDown){G.menu=(G.menu+1)%items.length;sfx('ui');}
  if(pressed.KeyW||pressed.ArrowUp){G.menu=(G.menu+items.length-1)%items.length;sfx('ui');}
  for(let i=0;i<items.length;i++){
    const y=130+i*24;
    if(mouse.y>=y-5&&mouse.y<y+15&&Math.abs(mouse.x-W/2)<86){G.menu=i;if(mouse.click){chooseMenu(i);return;}}
  }
  if(pressed.Enter||pressed.Space)chooseMenu(G.menu);
}
function updateStory(){
  G.storyT++;
  const s=STORY[G.story],len=s.txt.length;
  if(pressed.Enter||pressed.Space||mouse.click){
    if(G.storyT*0.7<len)G.storyT=Math.ceil(len/0.7)+1;
    else{G.story++;G.storyT=0;sfx('ui');if(G.story>=STORY.length)beginPlay();}
  }
}
function updateDialog(){
  const d=G.dlg,L=d.lines[d.i];
  d.n=Math.min(L.length,d.n+0.8);
  if(pressed.Enter||pressed.Space||pressed.KeyE||mouse.click){
    if(d.n<L.length)d.n=L.length;
    else{
      d.i++;d.n=0;sfx('ui');
      if(d.i>=d.lines.length){G.state='play';const f=d.onEnd;G.dlg=null;if(f)f();}
    }
  }
}
function updatePlay(){
  if(pressed.Escape||pressed.KeyP){G.state='pause';return;}
  if(pressed.KeyM||pressed.Tab){openMap();return;}
  if(pressed.KeyI){G.state='inv';sfx('ui');return;}
  if(G.pendingStage&&!G.fade){const sid=G.pendingStage;G.pendingStage=null;offerCards(sid);return;}
  if(P.dead){
    G.hint=null;G.deadT++;if(G.ghost){G.ghost.t++;G.ghost.y-=0.55;G.ghost.x=G.ghost.bx+Math.sin(G.ghost.t*0.08)*6;}
    if(G.hitstop>0)G.hitstop--;
    updatePlayer();updateParticles();updateHudFx();
    if(G.shake>0)G.shake=Math.max(0,G.shake-0.45);
    if(G.deadT>110&&(pressed.Enter||pressed.Space||mouse.click))respawn();
    return;
  }
  if(G.hitstop>0){G.hitstop--;return;}
  if(G.shake>0)G.shake=Math.max(0,G.shake-0.45);
  if(G.banner){G.banner.t++;if(G.banner.t>G.banner.dur)G.banner=null;}
  if(G.area)G.area.t++;
  updatePlayer();updateEnemies();updateStatics();updateBossTrigger();updateBullets();updatePK();updateParticles();updateHudFx();updateAmb();updateCam();checkExits();
}
function update(){
  G.t++;
  if(pressed.KeyN)setMusicOn(!musicOn);
  if(pressed.KeyB){sfxOn=!sfxOn;saveCfg();}
  applyTouch();
  if(G.fade)updateFade();
  switch(G.state){
    case 'splash':if(Object.keys(pressed).length>0||mouse.click){initAudio();G.state='title';sfx('ui');}break;
    case 'title':updateTitle();break;
    case 'story':updateStory();break;
    case 'play':if(!(G.fade&&G.fade.dir>0))updatePlay();else updateParticles();break;
    case 'dialog':updateDialog();break;
    case 'cards':updateCards();break;
    case 'inv':updateInv();break;
    case 'pause':
      if(pressed.Escape||pressed.KeyP||pressed.Enter||mouse.click)G.state='play';
      else if(pressed.KeyT){G.state='title';G.menu=0;G.hasSave=!!loadSave();}
      break;
    case 'map':updateMap();break;
    case 'shop':updateShop();break;
    case 'camp':updateCamp();break;
  }
  musicSync();
  for(const k in pressed)delete pressed[k];
  mouse.click=false;mouse.wheel=0;
}
function render(){
  ctx.imageSmoothingEnabled=false;
  if(G.state==='splash'){drawSplash();drawPortrait();if(!TOUCH.on)drawReticle();return;}
  if(G.state==='title'){drawTitle();vignette();drawPortrait();if(!TOUCH.on)drawReticle();return;}
  if(G.state==='story'){drawStory();vignette();drawPortrait();if(!TOUCH.on)drawReticle();return;}
  if(!R)return;
  drawWorld();
  if(['map','pause','inv','cards','shop','camp'].indexOf(G.state)<0)drawHUD();
  if(P.dead&&G.deadT<=40){const cx=clamp(Math.round(cam.x),0,Math.max(0,R.w*T-W)),cy=clamp(Math.round(cam.y),0,Math.max(0,R.h*T-H));ctx.save();ctx.translate(-cx,-cy);drawGhost();ctx.restore();}
  if(P.dead&&G.deadT>40){
    const a=Math.min(0.7,(G.deadT-40)/60);
    ctx.fillStyle='rgba(20,0,0,'+a+')';ctx.fillRect(0,0,W,H);
    {const cx=clamp(Math.round(cam.x),0,Math.max(0,R.w*T-W)),cy=clamp(Math.round(cam.y),0,Math.max(0,R.h*T-H));ctx.save();ctx.translate(-cx,-cy);drawGhost();ctx.restore();}
    if(G.deadT>70){
      bigTxt('VOCÊ MORREU',W/2,H*0.32,24,'#e8322a','#4a0a08');
      if(G.deadT>110&&Math.floor(G.t/24)%2===0)txt('ENTER ou toque: voltar à fogueira',W/2,H*0.32+40,'#ffe9b0',8,'center');
    }
  }
  vignette();
  if(G.state==='dialog')drawDialog();
  if(G.state==='cards')drawCards();
  if(G.state==='inv')drawInv();
  if(G.state==='map')drawMap();
  if(G.state==='shop')drawShop();
  if(G.state==='camp')drawCamp();
  if(G.state==='inv')drawCloseBtn();
  drawTouch();
  if(G.state==='pause')drawPause();
  if(G.fade){ctx.fillStyle='rgba(0,0,0,'+clamp(G.fade.a,0,1)+')';ctx.fillRect(0,0,W,H);}
  drawPortrait();
  if(!TOUCH.on)drawReticle();
}

/* ---------- laço principal ---------- */
let last=0,acc=0,errShown=false;
function frame(now){
  requestAnimationFrame(frame);
  if(!last)last=now;
  acc+=Math.min(100,now-last);last=now;
  let n=0;
  try{
    while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}
    if(n===5)acc=0;
    render();
  }catch(e){if(!errShown){errShown=true;console.error(e);}}
}
G.hasSave=!!loadSave();G.state='splash';
fit();
try{if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"');}catch(e){}
requestAnimationFrame(frame);
if(window.__OW_TEST)window.__OW_TEST.api={G,update,render,enterRoom,get P(){return P;},set P(v){P=v;},get R(){return R;},get EN(){return EN;},get BUL(){return BUL;},startNew,keys,pressed,mouse,ROOMS,BAG,REV,S,newPlayer,beginPlay,Mus,getTrack,TDEF,startTrack,musicTick,get PK(){return PK;},get AMB(){return AMB;},cam,offerCards,pickCard,TOUCH,openShop,buy,openTravel,travelTo,openCamp,MPOS,RDIM,get ST(){return ST;},UPS,tearCards,cycleAmmo,dropLoot,spawnPK,CARDS,get cards(){return G.cards;}};
})();
</script>
